<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shredworld</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- THE VERSION IS IN THE FILENAME AND NEVER IN A QUERY STRING. iOS drops an
     apple-touch-icon link whose href carries a `?` -- so the cache-buster that was meant to
     make the new icon arrive is what made NO icon arrive, and the home screen fell back to a
     screenshot. A new filename is a new URL with no query: it beats the icon cache without
     tripping that. Even so iOS only re-reads it when the shortcut is removed and re-added. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v3.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167-v3.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152-v3.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v3.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512-v3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shredworld">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- TWO VOICES, AND FREDOKA WAS NEITHER. It is a rounded friendly face -- soft terminals,
     wide counters, no edge -- which against spray-paint key art reads exactly as he put it:
     like a three-year-old's. The art carries the personality, so the HUD does not have to
     shout; it has to look like it belongs on the same poster.
       BUNGEE is urban signage: squared, heavy, built to be read small and from an angle. It
       is the street voice, and it goes on the few BIG things -- the button, the pill, the
       panel headings -- where personality is wanted and there is room for it.
       BARLOW CONDENSED does the work: keys, labels, the diagnostic chip, the speedo. Condensed
       is the point -- `JETPACK` has to fit inside a 58 px key and the build chip has to carry
       `c103 · 29 FPS · 203 DC · ★★ · JET OUT · JAM 117@430,178` on one line of a phone.
     `display=swap` so a font on a slow connection can never hold the first paint. -->
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--disp:'Bungee',system-ui,sans-serif;--ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
    --ink:#eaf6ff;--rim:rgba(157,247,255,.45);
    /* the poster's own palette, so the HUD and the art are the same object */
    --hot:#ff4fd8;--sun:#ffb43c;--sky:#57e8ff}
  /* touch-action:manipulation is what actually kills iOS double-tap-to-zoom. The viewport
     meta does not: Safari honours user-scalable=no for pinch and ignores it for the tap. */
  html,body{touch-action:manipulation;margin:0;height:100%;background:#0b1020;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--ui);color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* ---- boot card ---- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(circle at 50% 40%,#182a52,#0b1020 70%);z-index:20;transition:opacity .5s}
  #boot.off{opacity:0;pointer-events:none}
  /* HIS KEY ART, AND IT FADES IN RATHER THAN BLOCKING. 2.65 MB is not something to hold the
     first paint on: the gradient and the bar are up on the first frame the way they always
     were, and the poster arrives over the top of them whenever it arrives. `object-position`
     is biased ABOVE centre because the art is portrait and the logo is at the top of it -- a
     landscape phone crops the vertical, and centred it would take the wordmark off. */
  #bootArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;
    opacity:0;transition:opacity .45s ease-out}
  #bootArt.lit{opacity:1}
  /* THE STAND-IN WORDMARK, and BUNGEE IS WIDE. Ten heavy squared letters at 38px with .18em
     of tracking overflows a phone; the display face carries the personality and the SIZE has
     to come down to pay for it. Clamped on viewport width so it never touches the edges. */
  #boot h1{position:relative;font-family:var(--disp);font-size:clamp(20px,7.2vw,34px);letter-spacing:.01em;margin:0;
    text-transform:uppercase;color:#f4ecd8;
    text-shadow:0 3px 0 rgba(10,26,58,.9),0 0 30px rgba(120,238,255,.45);transition:opacity .3s}
  #boot h1.gone{opacity:0}          /* the art carries its own wordmark; this is the stand-in */
  /* The bar sits UNDER the art rather than across it, on a scrim, so it never crosses a face */
  #boot .foot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:0 20px calc(30px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(6,9,22,.72) 42%,rgba(6,9,22,.9))}
  #boot .bar{width:min(240px,62vw);height:6px;border-radius:3px;background:rgba(157,247,255,.2);overflow:hidden;margin-top:66px}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee7ff,#e8fbff);transition:width .15s}
  #boot .msg{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #boot .err{color:#ffb4b4;font-size:13px;max-width:80vw;text-align:center;white-space:pre-wrap;opacity:.9}
  /* ---- title card ----
     THE PICTURE BEHIND IT IS THE GAME. Plutopia builds a whole second scene for its title
     (`DIO.*`) because its world is procedural and the card wants a thing that does not exist
     in play. This one already has the shot in it -- he is stood in the street with his board,
     the traffic is running, the clouds are going over -- so the card is the ordinary scene
     and the ordinary post chain with a different CAMERA, and this is only type on glass. */
  #title{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:16px;padding:0 24px calc(48px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;transition:opacity .8s ease}
  /* pointer-events only once it is VISIBLE. #title is none throughout, so an invisible
     button over the boot card cannot be pressed -- which it could, and it started the
     game underneath the loading screen. */
  #title.on{opacity:1}
  #title.on #startB{pointer-events:auto}
  #title.go #startB{pointer-events:none}
  #title.go{opacity:0;transition:opacity .45s ease}
  /* HIS WORDMARK, NOT TYPE. No font sets that -- it is drawn, outlined, spattered and has a
     planet in it. It arrives with a transparent background, so the only work here is size and
     a shadow to lift it off the street behind it.
     WIDTH IS CAPPED IN BOTH AXES. The art is 2129x739, near 3:1, so sizing it on width alone
     puts it off the top of a landscape phone; `max-height` in vh is what stops that, and the
     two together mean one rule covers both ways round. */
  #title .word{margin:0 0 auto;padding-top:calc(26px + env(safe-area-inset-top));
    width:min(92vw,720px);max-height:34vh;object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(4,10,24,.65)) drop-shadow(0 0 42px rgba(120,238,255,.3));
    animation:wordIn .9s cubic-bezier(.16,1,.3,1) both}
  @keyframes wordIn{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
  #title .sub{font-size:12.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;opacity:.75;
    text-shadow:0 2px 10px rgba(0,0,0,.7)}
  #startB{touch-action:manipulation;cursor:pointer;border:0;font-family:var(--disp);
    font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#1a0730;
    padding:16px 46px;border-radius:14px;background:linear-gradient(180deg,var(--sun),#ff8a2b);
    box-shadow:0 6px 0 #a33f00,0 14px 30px rgba(8,18,38,.5),0 0 34px rgba(255,180,60,.4);
    animation:startPulse 2.4s ease-in-out infinite}
  /* A HARD BOTTOM EDGE RATHER THAN A BLUR. The poster's letters are drawn with a flat shadow
     under them, and a soft glow under the button sits in a different world from that. */
  #startB:active{animation:none;transform:translateY(4px);box-shadow:0 2px 0 #a33f00,0 6px 16px rgba(8,18,38,.5)}
  @keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  /* the character row: who he is, chosen on the card where it can be SEEN */
  #chars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  #chars button{touch-action:manipulation;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink);background:rgba(10,22,40,.45);border:1.5px solid var(--rim);border-radius:999px;padding:9px 16px;
    opacity:.75;transition:opacity .2s,border-color .2s,box-shadow .2s}
  #chars button.on{opacity:1;border-color:rgba(157,247,255,.95);box-shadow:0 0 18px rgba(120,238,255,.45),inset 0 0 14px rgba(120,238,255,.15);color:#fff}
  #chars button.busy{opacity:.5;animation:startPulse 1s ease-in-out infinite}
  #title.on #chars button{pointer-events:auto}
  #title.go #chars button{pointer-events:none}
  /* THE HUD DOES NOT EXIST UNTIL HE HAS PRESSED IT -- except the build badge, which is how he
     tells one build from the one before it and is wanted MOST on the first screen. */
  body.title #sticks,body.title .key,body.title #map,body.title #speed,body.title #help{opacity:0;pointer-events:none}
  /* ---- sticks (from Plutopia) ---- */
  #sticks .stick{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;z-index:4;touch-action:none;
    background:radial-gradient(circle,rgba(157,247,255,.10),rgba(157,247,255,.03) 58%,rgba(157,247,255,0) 74%);
    border:1.5px solid rgba(157,247,255,.26);box-shadow:inset 0 0 26px rgba(120,238,255,.08);transition:border-color .18s,box-shadow .18s}
  #sticks .stick.act{border-color:rgba(157,247,255,.62);box-shadow:inset 0 0 30px rgba(120,238,255,.16),0 0 18px rgba(120,238,255,.16)}
  #sticks .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 32%,rgba(255,250,236,.72),rgba(246,232,204,.34) 58%,rgba(110,170,196,.18));
    border:1px solid rgba(246,232,204,.55);box-shadow:0 0 10px rgba(157,247,255,.22),inset 0 1px 3px rgba(255,255,255,.32);transition:transform .06s linear,box-shadow .18s}
  #sticks .stick.act .knob{box-shadow:0 0 22px rgba(157,247,255,.55),inset 0 1px 3px rgba(255,255,255,.45)}
  #sticks .lbl{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font-family:var(--disp);text-transform:uppercase;
    font-size:9px;letter-spacing:.06em;color:var(--ink);opacity:.5}
  #stkL{left:calc(20px + env(safe-area-inset-left))} #stkR{right:calc(20px + env(safe-area-inset-right))}
  /* ---- round keys ---- */
  .key{position:fixed;width:62px;height:62px;border-radius:50%;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center;
    color:var(--ink);border:1.5px solid var(--rim);font:700 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;
    background:radial-gradient(circle at 40% 32%,rgba(157,247,255,.13),rgba(10,14,40,.52) 62%,rgba(10,14,40,.62));
    box-shadow:0 3px 0 rgba(6,14,34,.7),0 8px 18px rgba(0,0,0,.45),inset 0 0 18px rgba(120,238,255,.06);
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .07s linear,box-shadow .18s,border-color .18s}
  /* A FLAT EDGE UNDERNEATH, NOT A BLUR -- the poster's letters are drawn with a hard shadow
     under them, and a soft halo sits in a different world from that. Pressing one takes the
     edge away, which is the whole animation and costs nothing. */
  .key:active{transform:translateY(3px);box-shadow:0 0 0 rgba(6,14,34,.7),0 4px 10px rgba(0,0,0,.4)}
  .key.on{border-color:var(--sky);color:#fff;
    box-shadow:0 3px 0 rgba(6,14,34,.7),0 8px 18px rgba(0,0,0,.45),0 0 22px rgba(120,238,255,.45),inset 0 0 22px rgba(120,238,255,.22)}
  /* THE KIT IS THREE PLAIN KEYS IN A ROW, NOT A MENU. The radial fan was one button doing
     two jobs -- tap to toggle, press-and-hold to choose -- and a long press is a gesture you
     have to be told about. Three keys say what they are just by being on screen, and a tap is
     a tap. ABOVE the sticks, because they are 132 px wide and 20 px from each edge: on a phone
     that leaves about 110 px between them, which will not hold three keys at any size worth
     pressing. The band over them is empty and both thumbs reach it. */
  #kitRow{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(178px + env(safe-area-inset-bottom));
    z-index:4;display:flex;gap:13px;pointer-events:none}
  #kitRow .key{position:static;width:58px;height:58px;flex-direction:column;gap:2px;pointer-events:auto}
  #kitRow .key i{font-style:normal;font-size:20px;line-height:1}
  #kitRow .key u{text-decoration:none;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.8}
  #kitRow .key.on u{opacity:.95}
  /* AN INVISIBLE BUTTON IS STILL A BUTTON. `body.title .key` fades every key out on the title
     card, but the `#kitRow .key` rule above wins on specificity for `pointer-events` -- so
     without this the three keys would still take a thumb through the card at opacity 0, which
     is the `#startB` landmine one element over. */
  body.title #kitRow .key{pointer-events:none}
  /* THE RETICLE. Four ticks around a gap, not a dot: a dot over a police officer at forty
     metres is a pixel, and what has to read is WHICH THING is marked. `pointer-events:none`
     without exception -- it sits in the middle of the play area and can never eat a thumb. */
  #retic{position:fixed;z-index:5;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;
    animation:reticIn .12s ease-out}
  #retic[hidden]{display:none}
  #retic i{position:absolute;background:rgba(157,247,255,.95);box-shadow:0 0 8px rgba(120,238,255,.9)}
  #retic i:nth-child(1){left:50%;top:0;width:2px;height:11px;margin-left:-1px}
  #retic i:nth-child(2){left:50%;bottom:0;width:2px;height:11px;margin-left:-1px}
  #retic i:nth-child(3){top:50%;left:0;height:2px;width:11px;margin-top:-1px}
  #retic i:nth-child(4){top:50%;right:0;height:2px;width:11px;margin-top:-1px}
  @keyframes reticIn{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
  /* The charge, wound round the right stick: it is the one thing on screen that says how big
     the shot you are about to take is, and it belongs where the thumb already is. */
  #sticks .stick .chg{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;
    background:conic-gradient(rgba(198,156,255,.9) calc(var(--c,0) * 360deg),rgba(198,156,255,0) 0);
    -webkit-mask:radial-gradient(circle,transparent 66%,#000 69%);mask:radial-gradient(circle,transparent 66%,#000 69%)}
  #resetB{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;font-size:16px}
  #soundB{top:calc(14px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right));width:40px;height:40px;font-size:15px}
  #map{position:fixed;top:calc(62px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:116px;height:116px;border-radius:14px;z-index:4;pointer-events:none;
    border:1.5px solid rgba(157,247,255,.30);box-shadow:0 4px 16px rgba(0,0,0,.45)}
  /* ---- the settings panel ---- */
  #gearB{top:calc(14px + env(safe-area-inset-top));right:calc(110px + env(safe-area-inset-right));width:40px;height:40px;font-size:17px}
  #opt{position:fixed;z-index:9;top:calc(62px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:min(280px,calc(100vw - 28px));max-height:calc(100vh - 110px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:12px 14px 14px;border-radius:16px;border:1.5px solid rgba(157,247,255,.34);
    background:rgba(8,12,34,.93);box-shadow:0 10px 34px rgba(0,0,0,.6);
    font:600 12px/1.3 var(--ui);letter-spacing:.04em;color:var(--ink);-webkit-tap-highlight-color:transparent}
  #opt[hidden]{display:none}
  #opt h4{margin:12px 0 6px;font-family:var(--disp);font-size:9px;letter-spacing:.04em;text-transform:uppercase;opacity:.55;color:var(--sky)}
  #opt h4:first-child{margin-top:0}
  #opt .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
  #opt .row span{flex:1;text-transform:uppercase;font-size:11.5px;letter-spacing:.05em;opacity:.85}
  #opt .row b{min-width:34px;text-align:right;font-size:11.5px;color:var(--sky);font-weight:700}
  #opt input[type=range]{flex:0 0 108px;width:108px;height:26px;accent-color:#8ef0ff;background:transparent}
  #opt .seg{display:flex;gap:6px}
  #opt .seg i{font-style:normal;padding:5px 9px;border-radius:9px;border:1px solid rgba(157,247,255,.28);
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.6}
  #opt .seg i.on{border-color:rgba(157,247,255,.95);background:rgba(120,238,255,.16);color:#fff;opacity:1}
  #opt .tog{padding:5px 11px;border-radius:9px;border:1px solid rgba(157,247,255,.28);font-size:9.5px;
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.6}
  #opt .tog.on{border-color:rgba(157,247,255,.95);background:rgba(120,238,255,.16);color:#fff;opacity:1}
  /* ---- chips ---- */
  .chip{position:fixed;z-index:4;font:600 12px/1.15 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);opacity:.72;
    padding:7px 10px;border-radius:999px;border:1px solid rgba(157,247,255,.22);background:rgba(10,14,40,.45);backdrop-filter:blur(6px)}
  #build{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));opacity:1;padding:6px 12px}
  #build b{font-family:var(--disp);font-size:15px;letter-spacing:0;color:var(--sky);text-shadow:0 2px 0 rgba(8,20,44,.9),0 0 14px rgba(120,238,255,.7)}
  #build i{font-style:normal;font-size:11px;opacity:.6;margin-left:8px;letter-spacing:.04em}
  /* Three slow pulses on load. The question this answers is "did it actually reload",
     and a number that looks identical whether it changed or not cannot answer it. */
  #build.fresh{animation:fresh 1.5s ease-out 3}
  @keyframes fresh{0%,100%{border-color:rgba(157,247,255,.22);box-shadow:none}
    45%{border-color:rgba(157,247,255,.95);box-shadow:0 0 26px rgba(120,238,255,.8),inset 0 0 18px rgba(120,238,255,.3)}}
  /* The newer build is on the server and this one is not it. */
  #upd{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;z-index:6;border:0;cursor:pointer;
    font:400 11px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;color:#1a0730;padding:12px 17px;border-radius:12px;
    background:linear-gradient(180deg,#a6f4ff,#49cdec);box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 26px rgba(120,238,255,.55);
    animation:updp 1.5s ease-in-out infinite}
  @keyframes updp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  /* THE SPEEDO SAT ON TOP OF THE BUILD CHIP AND ATE THE THING THE BUILD CHIP IS FOR.
     `#build` grows with whatever `missing()` has to say -- NO CLOUD GLB, NO COP GLB, JAM n@x,z
     -- and a centred `#speed` overlapped exactly that tail, so the jam coordinate was
     unreadable in the one screenshot that reported a jam. It moves to the RIGHT of centre and
     down a line; the top-left gutter belongs to the build chip. */
  #speed{top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;min-width:70px;text-align:center}
  #build{max-width:calc(100vw - 190px - env(safe-area-inset-left) - env(safe-area-inset-right))}
  #build i{white-space:normal}
  #speed b{font-family:var(--disp);font-size:17px;letter-spacing:0;margin-right:5px;color:#fff}
  #help{bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);opacity:.45;text-align:center;letter-spacing:.1em;text-transform:none;font-size:11px}
  @media (pointer:coarse){#help{display:none}}
</style>
</head>
<body class="title">
<div id="boot"><img id="bootArt" alt=""><h1 id="bootH1">Shredworld</h1><div class="foot"><div class="bar"><i id="bootBar"></i></div><div class="msg" id="bootMsg">loading shredworld</div><div class="err" id="bootErr"></div></div></div>
<div id="title"><img id="titleArt" class="word" alt="Shredworld"><div id="chars"></div><div class="sub">swipe to change &middot; two thumbs</div><button id="startB">Start</button></div>
<div id="sticks">
  <div class="stick" id="stkL"><div class="knob"></div><div class="lbl">MOVE</div></div>
  <div class="stick" id="stkR"><div class="chg" id="stkRChg"></div><div class="knob"></div><div class="lbl">LOOK</div></div>
</div>
<div id="kitRow"></div>
<div id="retic" hidden><i></i><i></i><i></i><i></i></div>
<div class="key" id="resetB">&#8635;</div>
<div class="key on" id="soundB">&#9834;</div>
<div class="key" id="gearB">&#9881;</div>
<div id="opt" hidden></div>
<canvas id="map" hidden></canvas>
<div class="chip" id="build"><b id="buildN">c111</b><i id="perf">···</i></div>
<button id="upd" hidden></button>
<div class="chip" id="speed"><b>0</b>km/h</div>
<div class="chip" id="help">WASD move · drag to orbit · space jump · B board · R reset</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';

//    acceleration he currently HAS: it starts at push0 and reaches all of it over pushT
//    seconds of continuously asking, and falls back at pushOut rather than resetting, so
//    a step, a pause and another step is not three standing starts. On top of it accFall
//    thins the acceleration out again as he nears top speed, so the first units come
//    quickly and the last take their time. He genuinely walks, then jogs, then runs.
//

//    `faceH` is where his body actually points, and it comes round more slowly the
//    faster he is going: quick on the spot, an arc at a run, because a running man arcs.
//

//    thumb says, so a standing start goes where you point. Above plantFull it goes along
//    HIS OWN FACING, so facing and travel cannot come apart and the only way to change
//    direction at a run is to turn through it. This is the part I had missing, and its
//    absence is exactly the moonwalk: without it the velocity keeps answering to the
//    stick while the body has already swung round, so he faces one way and travels
//    another. A hard turn also costs him speed, which is what plants the feet rather

  near: 10, far: 85, floor: .10,          // how a sound a long way off is attenuated
  raw: {}, buf: {}, miss: [], ready: 0,

        // coming down. Bump it by hand when a sound is replaced in place -- that is the only
        // time a phone's cache is actually wrong.

    // board drop and a landing on one frame. Neither ceiling decides which sound is right;
    // they stop one event arriving as a handful. Returning TRUE when refused matters -- a
    // caller reading false plays the oscillator fallback, which puts the pile-up back as beeps.

// whose gain and centre follow his speed. Drop a real one in audio/ and bind it here.

  src: null, g: null, f: null,
  start() {
    if (this.src || !SFX.ctx) return;

  raw: {}, track: {},

  // through and another of the set that is NOT the one just heard takes over, so it reads as
  // a soundtrack rather than as a loop going round.
  files: { theme: ['plutopia_song_03', 'plutopia_song_04'] },

      // every push. Bump MUSICV when a track is replaced in place.
      set.forEach((f, i) => fetch(A('audio/' + f + '.mp3')).then(r => r.ok ? r.arrayBuffer() : null)

const snd = {
  ollie: () => SFX.play('swoosh', .30, rnd(1.18, 1.38)) || SFX.noise(.10, .10, 2400),
  jump: () => SFX.play('swoosh', .28, rnd(1.02, 1.22)) || SFX.noise(.11, .10, 2100),
  // a body flip is longer and lower than the pop that started it
  flip: () => SFX.play('swoosh', .44, rnd(.70, .84)) || SFX.noise(.22, .14, 1200),
  // and a board trick is the opposite: short, high, with a tick of deck in it

  // k is how hard he came down, 0..1
  land: (k, board) => board
    ? (SFX.play('wood', .30 + .50 * k, rnd(.80, 1.05)) || SFX.noise(.09, .16, 900))

    ? SFX.play('clang', .30, rnd(1.20, 1.45), x, z) || SFX.blip(420, .07, 'square', .06, 200, x, z)
    : tier === 1
      ? SFX.play('clang', .58, rnd(.95, 1.12), x, z) || SFX.blip(260, .10, 'square', .10, 120, x, z)
      : (SFX.play('clang', .85, rnd(.72, .86), x, z) || SFX.noise(.12, .30, 800, x, z),

  grind: () => SFX.play('clang', .34, rnd(.45, .60)) || SFX.noise(.20, .18, 1400),
  // THE BLASTER, AND THE CHARGE IS IN BOTH NUMBERS. Louder AND LOWER as it fills -- pitch is

const scene = new THREE.Scene();
const FOGC = new THREE.Color(0xb9d3ea);

const camera = new THREE.PerspectiveCamera(CAM.fov, innerWidth / innerHeight, .3, 1600);

const sun = new THREE.DirectionalLight(0xfff1dc, LIGHT.sun); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);

// that reads as a shadow rather than as a handful of squares. The cost of the smaller box
// is that a building further than 48 m stops casting; the crispness is worth it.
// Plutopia wraps near/far tightly round the receivers and calls that "most of the cure
// for the striping on flat ground". Mine spent 410 units of depth range on a scene about
// a hundred deep, which is precision thrown away for nothing.
const SHADOW = { span: 48, dist: 160 };
// HOW DARK A SHADOW IS ALLOWED TO GET, AND IT IS NOT 1. A projected shadow map removes the
// WHOLE of the sun, which against `LIGHT.sun` 3.4 and `hemi` 1.6 leaves a surface at under a
// third of its lit value -- and on a toon ramp with a hard band edge that reads as a hole cut
// in the picture rather than as shade. It is also indistinguishable, from the phone, from a
// mesh whose normals are wrong: "the up ramp to the bridge is just black and I cannot tell if
// it is shading or shadow" is that, and it is a fair complaint about the picture as well as
// about the diagnosis.
// PLUTOPIA THREW THE SHADOW MAP AWAY ENTIRELY and used painted pools plus a blob under each
// character, on exactly this reasoning -- harsh projected shadows kill a painterly look. That
// does not port whole: its ground is procedural terrain with a shader we own to paint into,
// and this city's ground is an imported GLB. What ports is the VERDICT. So the shadow stays
// but stops being a hole: `shadow.intensity` is three's own per-light dial for how much of
// the light a shadow may remove, so at `SHADE.k` the shadow is a soft tinted darkening and a
// shadowed wall still shows its own shading underneath. And the part Plutopia was right about
// that a shadow map is genuinely bad at -- the contact under his feet -- is a blob (`BLOB`).
// `city.SHADE.k = 1` is the old look.
// **ONE OR THE OTHER, NEVER BOTH.** c79 added the blob ALONGSIDE the shadow map, which is not
// what Plutopia does and looks wrong for an obvious reason once you see it: a character with a
// projected shadow AND a disc under him has two shadows. Plutopia's arrangement was that the
// real shadows came OFF, static things kept a baked map, and the moving things got the discs
// instead. So `mode` picks one: 'map' is the shadow map alone (the default, and the one he
// kept), 'blob' turns `sun.castShadow` off and draws the discs instead. Nothing draws both.
const SHADE = { k: .32, mode: 'map' };
const sc = sun.shadow.camera;
sc.left = sc.bottom = -SHADOW.span; sc.right = sc.top = SHADOW.span;

// the map, so it cannot be a constant. Plutopia uses two and a half.

  // each other the two rotated copies of its normal point opposite ways and the weighted
  // sum cancels to nothing. three applies the skin matrix to the normal and does NOT
  // renormalise before this line, so normalize() gets a zero vector and returns NaN --

    }
  } catch (e) { /* offline, or no version.json yet: nothing worth saying */ }
}
updEl.addEventListener('click', () => location.replace(location.pathname + '?v=' + Date.now()));
setInterval(checkUpdate, 15000);
addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
checkUpdate();

// ---------- frame ----------
const clock = new THREE.Clock();
let ready = false;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  if (!ready) return;
  // THE CARD CLOCK ADVANCES FIRST. It used to tick inside `fxStep`, at the END of the frame,
  // so every card spawned during the frame was born a sixtieth of a second in the FUTURE --
  // `vAge < 0.0` discards, and the frame that got dropped was the first one: the spark.
  FX.t += dt;
  toonSync();
  // The card runs the WHOLE scene -- traffic, clouds, his mixer, the post chain. Only the
  // player is suspended, and only because he is being posed rather than driven.
  // BEFORE `stepPlayer`, so a thumb holding a charge is not also read as a sprint.
  if (!TITLE.on) { stepAim(dt); stepJet(dt); }
  if (TITLE.on) titleFrame(dt); else stepPlayer(dt);
  stepBolts(dt);
  stepTraffic(dt);
  stepShots(dt);
  stepCops(dt);      // ALWAYS. Skipping it on the title card leaves six men in the T-pose on
                     // the street behind the logo -- a mixer that never updates is a bind pose,
                     // and `idle` already refuses to notice the player while `TITLE.on`.
  stepClouds(dt);
  WHEELS.set(player.speed, !TITLE.on && player.board && player.grounded && !player.hit, !!player.rail && SFX.on);
  if (TITLE.dive > 0) diveFrame(dt); else if (!TITLE.on) stepCam(dt);
  stepHole();
  blobStep();
  stepSlash(dt);
  fxStep(dt);
  {
    // THE RING IS ALSO HOW HE FINDS THE CONTROL. Showing it only while charging means the pad
    // looks identical armed and unarmed, and "the blaster doesn't work at all" is what an
    // invisible control reads as. Dim the moment it is out, full while the charge builds.
    const el = document.getElementById('stkRChg');
    const out = KIT.on && KIT.cur === 'blaster' && !player.board;
    const k = player.aim ? (WEAP.min + (1 - WEAP.min) * player.chg) : 0;
    if (el) { el.style.opacity = player.aim ? '1' : (out ? '.34' : '0'); el.style.setProperty('--c', (k || 1).toFixed(3)); }
  }
  jamScan(dt);
  drawMap(dt);
  if (colin.mixer) colin.mixer.update(dt);
  renderPost();
  fpsN++; fpsT += dt; if (fpsT > .5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; perfEl.textContent = fps + ' fps · ' + renderer.info.render.calls + ' dc' + dbgInfo + missing(); }
  speedEl.textContent = Math.round(player.speed * 3.6);
}
frame();

// ---------- go ----------
(async () => {
  try {
    let city;
    try { city = await loadGLB('models/city.glb', 'loading shredworld'); }
    catch (e) { console.warn('no baked city, loading the source', e); city = await loadGLB('LowPoly_City_01.glb', 'loading the source city'); }
    setBoot('building the streets', 1);
    await new Promise(r => setTimeout(r, 30));
    let ramps = null;
    try { ramps = await loadGLB(PARK.url, 'building the park'); }
    catch (e) { console.warn('no ramps', e); }
    try { buildBoard(await loadGLB(BOARD.url, 'shaping the board')); }
    catch (e) { console.warn('no board model, keeping the procedural one', e); }
    let copGlb = null, gunGlb = null;
    try { copGlb = await loadGLB(COP.url, 'swearing in the police'); }
    catch (e) { console.warn('[cop] no police_officer.glb', e); }
    try { gunGlb = await loadGLB(COP.gunUrl, 'issuing sidearms'); }
    catch (e) { console.warn('[cop] no pistol.glb -- they will chase you unarmed', e); }
    try { attachGear(await loadGLB(WEAP.url, 'charging the blaster'), 'blaster'); }
    catch (e) { console.warn('[kit] no blaster', e); }
    try { attachGear(await loadGLB(JET.url, 'fuelling the jetpack'), 'jet'); }
    catch (e) { console.warn('[kit] no jetpack', e); }
    // NOT `weapFit()` HERE. Colin has not loaded yet at this point -- he is three awaits
    // further down -- so there is no hand to hang anything on. `wear` calls `gearRehome` for
    // the first skin and for every change after it, which is the one place that knows.
    buildCity(city, ramps);
    buildLadders();
    if (copGlb) buildCops(copGlb, gunGlb);
    {
      const got = [];
      for (const u of CLOUDS.urls) { try { got.push(await loadGLB(u, 'loading the sky')); } catch (e) { /* that one is not here */ } }
      if (got.length) buildClouds(got); else console.warn('no cloud models found');
    }
    // THE BORROWED CLIPS GO INTO THE SAME POOL COLIN'S OWN ARE IN, so every skin picks them up
    // through `skinClips` unchanged -- the same filter, the same HIPFIX, no second path. They
    // are already rotation-only (see `npm run melee`), which is what makes that safe: Colin
    // takes the pool raw, and an alien's position tracks would stretch him to alien lengths.
    let melee = null;
    try { melee = await loadGLB(MELEE.url, 'learning to fight'); }
    catch (e) { console.warn('[melee] no melee.glb -- punches and the roll will be missing', e); }
    setBoot('waking colin', 1);
    try { const c = await loadGLB('models/colin.glb', 'loading colin'); buildColin(c, melee && melee.animations); } catch (e) { console.warn('colin failed', e); }
    // AND THE OFFICERS BORROW HIS AIR CLIPS, here rather than in `buildCops` -- they are built
    // three awaits earlier and `colin.clips` does not exist yet when they are.
    copsLearnFlight();
    const sg = groundAt(player.pos.x, player.pos.z, 60, 0);
    player.pos.y = sg.hit ? sg.floor : hmAt(player.pos.x, player.pos.z); player.safe.copy(player.pos);
    buildMap();
    ready = true;
    setBoot('drop in', 1);
    await bootHold();                  // the splash is a card, not a flicker
    document.getElementById('boot').classList.add('off');
    titleEl.classList.add('on');
    // whoever he was last time, fetched now rather than on the boot path: the card shows
    // Colin until it arrives, and the chip stays lit for the one it is waiting on.
    try { const k = localStorage.getItem(CHARS.key); if (k && k !== 'colin' && CHARS.list.some(c => c.key === k)) pickChar(k, 1, 1); } catch (e) {}
  } catch (e) { console.error(e); bootErr.textContent = 'could not load: ' + (e && e.message || e); }
})();
window.shred = window.city = { BOOT, TITLE, PARADE, MELEE, HANG, LAD, LADDERS, startGame, CHARS, pickChar, cycleChar, BOARD, MAP, HOLE, PARK, GRIND, RAILS, SFX, MUSIC, WHEELS, snd, TRICK, STRIDE, TOON, COLINM, SKY, CLOUDS, ENV, HIT, ROLL, clouds, SK8, MOVE, GAIT, CAM, POST, LIGHT, SHADOW, SHADE, BLOB, SLASH, OPT, optToggle, JAM, TRAF, COP, cops, copGunFit, gunFit: copGunFit, KIT, WEAP, BOLT, JET, SHOT, HEAT, FX, fx: fxTry, fxSheet, gear, weapFit, kitTap, kitPick: kitTap, slash: slashTry, sun, player, cam, cars, tiles, solids, hmAt, renderer, scene, camera, compMat, cityGroup, colin };
</script>
</body>
</html>
