<!-- THE VERSION IS IN THE FILENAME AND NEVER IN A QUERY STRING. iOS drops an
     apple-touch-icon link whose href carries a `?` -- so the cache-buster that was meant to
     make the new icon arrive is what made NO icon arrive, and the home screen fell back to a
     screenshot. A new filename is a new URL with no query: it beats the icon cache without
     tripping that. Even so iOS only re-reads it when the shortcut is removed and re-added. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v3.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167-v3.png">

<style>
  :root{--disp:'Fredoka',system-ui,sans-serif;--ink:#eaf6ff;--rim:rgba(157,247,255,.45)}
  /* touch-action:manipulation is what actually kills iOS double-tap-to-zoom. The viewport
     meta does not: Safari honours user-scalable=no for pinch and ignores it for the tap. */
  html,body{touch-action:manipulation;margin:0;height:100%;background:#0b1020;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--disp);color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* ---- boot card ---- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(circle at 50% 40%,#182a52,#0b1020 70%);z-index:20;transition:opacity .5s}
  #boot.off{opacity:0;pointer-events:none}
  #boot h1{font-weight:700;font-size:38px;letter-spacing:.18em;margin:0;text-transform:uppercase;color:#bff4ff;text-shadow:0 0 24px rgba(120,238,255,.6)}
  #boot .bar{width:220px;height:6px;border-radius:3px;background:rgba(157,247,255,.15);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee7ff,#e8fbff);transition:width .15s}
  #boot .msg{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
  #boot .err{color:#ffb4b4;font-size:13px;max-width:80vw;text-align:center;white-space:pre-wrap;opacity:.9}
  /* ---- title card ----
     THE PICTURE BEHIND IT IS THE GAME. Plutopia builds a whole second scene for its title
     (`DIO.*`) because its world is procedural and the card wants a thing that does not exist
     in play. This one already has the shot in it -- he is stood in the street with his board,
     the traffic is running, the clouds are going over -- so the card is the ordinary scene
     and the ordinary post chain with a different CAMERA, and this is only type on glass. */
  #title{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:16px;padding:0 24px calc(48px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;transition:opacity .8s ease}
  /* pointer-events only once it is VISIBLE. #title is none throughout, so an invisible
     button over the boot card cannot be pressed -- which it could, and it started the
     game underneath the loading screen. */
  #title.on{opacity:1}
  #title.on #startB{pointer-events:auto}
  #title.go #startB{pointer-events:none}
  #title.go{opacity:0;transition:opacity .45s ease}
  #title .word{margin:0 0 auto;padding-top:calc(40px + env(safe-area-inset-top));text-align:center;
    font-weight:700;font-size:clamp(40px,14vw,104px);line-height:.9;letter-spacing:.05em;text-transform:uppercase;color:#fff;
    text-shadow:0 3px 0 rgba(8,22,42,.5),0 0 38px rgba(120,238,255,.5),0 0 100px rgba(255,186,110,.4)}
  #title .word i{display:block;font-style:normal;color:#ffd79a;
    text-shadow:0 3px 0 rgba(8,22,42,.5),0 0 42px rgba(255,176,86,.75)}
  #title .sub{font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;opacity:.7}
  #startB{touch-action:manipulation;cursor:pointer;border:0;font-family:var(--disp);
    font-weight:700;font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:#06131f;
    padding:17px 48px;border-radius:999px;background:linear-gradient(180deg,#eafdff,#7ee7ff);
    box-shadow:0 10px 30px rgba(8,18,38,.45),0 0 30px rgba(120,238,255,.45);animation:startPulse 2.4s ease-in-out infinite}
  #startB:active{animation:none;transform:scale(.97)}
  @keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  /* the character row: who he is, chosen on the card where it can be SEEN */
  #chars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  #chars button{touch-action:manipulation;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink);background:rgba(10,22,40,.45);border:1.5px solid var(--rim);border-radius:999px;padding:9px 16px;
    opacity:.75;transition:opacity .2s,border-color .2s,box-shadow .2s}
  #chars button.on{opacity:1;border-color:rgba(157,247,255,.95);box-shadow:0 0 18px rgba(120,238,255,.45),inset 0 0 14px rgba(120,238,255,.15);color:#fff}
  #chars button.busy{opacity:.5;animation:startPulse 1s ease-in-out infinite}
  #title.on #chars button{pointer-events:auto}
  #title.go #chars button{pointer-events:none}
  /* THE HUD DOES NOT EXIST UNTIL HE HAS PRESSED IT -- except the build badge, which is how he
     tells one build from the one before it and is wanted MOST on the first screen. */
  body.title #sticks,body.title .key,body.title #map,body.title #speed,body.title #help{opacity:0;pointer-events:none}
  /* ---- sticks (from Plutopia) ---- */
  #sticks .stick{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;z-index:4;touch-action:none;
    background:radial-gradient(circle,rgba(157,247,255,.10),rgba(157,247,255,.03) 58%,rgba(157,247,255,0) 74%);
    border:1.5px solid rgba(157,247,255,.26);box-shadow:inset 0 0 26px rgba(120,238,255,.08);transition:border-color .18s,box-shadow .18s}
  #sticks .stick.act{border-color:rgba(157,247,255,.62);box-shadow:inset 0 0 30px rgba(120,238,255,.16),0 0 18px rgba(120,238,255,.16)}
  #sticks .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 32%,rgba(255,250,236,.72),rgba(246,232,204,.34) 58%,rgba(110,170,196,.18));
    border:1px solid rgba(246,232,204,.55);box-shadow:0 0 10px rgba(157,247,255,.22),inset 0 1px 3px rgba(255,255,255,.32);transition:transform .06s linear,box-shadow .18s}
  #sticks .stick.act .knob{box-shadow:0 0 22px rgba(157,247,255,.55),inset 0 1px 3px rgba(255,255,255,.45)}
  #sticks .lbl{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.22em;color:var(--ink);opacity:.55}
  #stkL{left:calc(20px + env(safe-area-inset-left))} #stkR{right:calc(20px + env(safe-area-inset-right))}
  /* ---- round keys ---- */
  .key{position:fixed;width:62px;height:62px;border-radius:50%;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center;
    color:var(--ink);border:1.5px solid var(--rim);font:600 10.5px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;
    background:radial-gradient(circle at 40% 32%,rgba(157,247,255,.13),rgba(10,14,40,.52) 62%,rgba(10,14,40,.62));
    box-shadow:0 4px 16px rgba(0,0,0,.45),inset 0 0 18px rgba(120,238,255,.06);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .key.on{border-color:rgba(157,247,255,.95);box-shadow:0 0 22px rgba(120,238,255,.5),inset 0 0 22px rgba(120,238,255,.2);color:#fff}
  #boardB{right:calc(166px + env(safe-area-inset-right));bottom:calc(61px + env(safe-area-inset-bottom))}
  #resetB{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;font-size:16px}
  #soundB{top:calc(14px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right));width:40px;height:40px;font-size:15px}
  #map{position:fixed;top:calc(62px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:116px;height:116px;border-radius:14px;z-index:4;pointer-events:none;
    border:1.5px solid rgba(157,247,255,.30);box-shadow:0 4px 16px rgba(0,0,0,.45)}
  /* ---- chips ---- */
  .chip{position:fixed;z-index:4;font:600 11px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:.7;
    padding:7px 10px;border-radius:999px;border:1px solid rgba(157,247,255,.22);background:rgba(10,14,40,.45);backdrop-filter:blur(6px)}
  #build{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));opacity:1;padding:6px 12px}
  #build b{font-size:18px;font-weight:700;letter-spacing:.04em;color:#8ef0ff;text-shadow:0 0 12px rgba(120,238,255,.75)}
  #build i{font-style:normal;font-size:10px;opacity:.55;margin-left:8px;letter-spacing:.1em}
  /* Three slow pulses on load. The question this answers is "did it actually reload",
     and a number that looks identical whether it changed or not cannot answer it. */
  #build.fresh{animation:fresh 1.5s ease-out 3}
  @keyframes fresh{0%,100%{border-color:rgba(157,247,255,.22);box-shadow:none}
    45%{border-color:rgba(157,247,255,.95);box-shadow:0 0 26px rgba(120,238,255,.8),inset 0 0 18px rgba(120,238,255,.3)}}
  /* The newer build is on the server and this one is not it. */
  #upd{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;z-index:6;border:0;cursor:pointer;
    font:700 12px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:#04141c;padding:12px 17px;border-radius:999px;
    background:linear-gradient(180deg,#a6f4ff,#49cdec);box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 26px rgba(120,238,255,.55);
    animation:updp 1.5s ease-in-out infinite}
  @keyframes updp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  #speed{top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;min-width:70px;text-align:center}
  #speed b{font-size:20px;letter-spacing:0;margin-right:4px}
  #help{bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);opacity:.45;text-align:center;letter-spacing:.1em;text-transform:none;font-size:11px}
  @media (pointer:coarse){#help{display:none}}
</style>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';

const BUILD = 'c79';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1400);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
// frame-rate independent smoothing: how far toward the target in one half-life
const damp = (cur, tgt, half, dt) => lerp(cur, tgt, 1 - Math.pow(0.5, dt / half));
const wrapAngle = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
const smooth = (a, b, x) => { const t = clamp((x - a) / ((b - a) || 1e-6), 0, 1); return t * t * (3 - 2 * t); };

// ---------- tuning ----------
// LOCOMOTION, ported from Plutopia, where this has actually been through the mill.
// Three separate ideas, and the moonwalk comes from missing the third.
//
// 1. THE GATHER IS IN HIS LEGS, NOT IN THE TARGET. `push` is how much of his
//    acceleration he currently HAS: it starts at push0 and reaches all of it over pushT
//    seconds of continuously asking, and falls back at pushOut rather than resetting, so
//    a step, a pause and another step is not three standing starts. On top of it accFall
//    thins the acceleration out again as he nears top speed, so the first units come
//    quickly and the last take their time. He genuinely walks, then jogs, then runs.
//
// 2. FACING IS NOT HEADING. `heading` is the thumb's direction, taken instantly.
//    `faceH` is where his body actually points, and it comes round more slowly the
//    faster he is going: quick on the spot, an arc at a run, because a running man arcs.
//
// 3. AND THE LEGS PUSH WHERE HIS FEET ARE PLANTED. Below plantAt the push goes where the
//    thumb says, so a standing start goes where you point. Above plantFull it goes along
//    HIS OWN FACING, so facing and travel cannot come apart and the only way to change
//    direction at a run is to turn through it. This is the part I had missing, and its
//    absence is exactly the moonwalk: without it the velocity keeps answering to the
//    stick while the body has already swung round, so he faces one way and travels
//    another. A hard turn also costs him speed, which is what plants the feet rather
//    than merely pointing them.
//
// Steering is split from acceleration as well: `turn` caps how fast the velocity can be
// pushed SIDEWAYS, separately from how fast it can be lengthened.
const MOVE = {
  max: 9, acc: 24, accFall: .93, drag: 46,
  push0: .30, pushT: .85, pushOut: 2.6,
  airAcc: 11, airDrag: 1.2,
  // HOLD THE RIGHT PAD ON FOOT AND HE WINDS UP. The same thumb that taps to jump: held, it is
  // a sprint AND a charge, and letting go is a jump scaled by how long you held it. One input
  // doing two things that belong together -- you run at something and leap it.
  chargeMax: .9,     // seconds to a full wind-up
  sprint: 1.95,      // top speed multiplier at full charge: 9 -> 17.6 m/s, 63 km/h
  chargeUp: .42,     // extra jump SPEED at full charge, as a fraction
  chargeOut: 5.0,    // and how much he is thrown along his travel, m/s
  turn: 26, airTurn: 9,
  face0: 11, face1: 5.2,
  plantAt: 2.2, plantFull: 6.5,
  turnBrake: .42,
  // Exaggerated on purpose: ~2.8 m of apex and a full second of air, so there is room for
  // the going-up and coming-down clips to actually read as two different things.
  jump: 10.6, g: 20, dead: .12, curve: 1.4, step: .55, coyote: .12,
};
// GAIT. Three clips at once, weighted by how fast he is ACTUALLY travelling, so the
// blend is a consequence of the speed rather than a second decision about it. Each
// clip's clock is tied to the ground speed as well, so the feet do not skate.
// THE LANDING ROLL OWNS HIM UNTIL IT IS DONE. It was given .42 s of weight out of a
// 1.6 s clip, so it was cut off before he was halfway round. It now holds for the clip's
// OWN duration, read off the clip rather than guessed, and while it runs the stick does
// nothing: a roll carries you forward a couple of metres and stops, it does not steer.
// That is also what stops the slide -- there is no target velocity to chase, only the
// carry the roll itself implies, falling away as he comes back to his feet.
// He rolls THROUGH the landing at the speed he arrived with. It was a fixed 4.6 decaying
// quadratically, which is about two metres over a second and a half -- a roll on the spot.
// Coming out of a run he should cover five or six, so the speed he had in the air is what
// carries him, bled off linearly over the clip.
// free is the tail of the roll that belongs to YOU. The clip still plays whole, but once
// he is past this much of it the stick takes over and he runs out of it, instead of
// standing about finishing a last half second nobody is watching.
// `rate` speeds the landing roll up. The clip is 1.60 s at 1x, which reads as a beat too long
// on the way out of a jump; at 1.25 it was 1.28 and STILL read long, so it is 1.70 -- 0.94 s,
// which is about what a real tuck-and-up takes. It has to move as a PAIR with rollDur -- the
// roll's speed bleed is `rollT / rollDur`, so a clip played faster than the timer it is
// measured against comes to a stop and then slides. `rollDur` is derived from `rate` two
// hundred lines down, which is what makes that pairing automatic rather than remembered.
const ROLL = { at: -7, min: 4, max: 10, free: .42, rate: 1.70 };
// `windUp` is the on-foot crouch, and it is EMPTY until there is a clip for it. Name one here
// and colinAnim blends it in on the GROUND, by how loaded `p.charge` is, while he is holding
// the right pad. That is where the two `*_jump_init` clips were always trying to be: they are
// crouches, and they were being played in the AIR for the first .19 s of the flight, which is
// two poses that do not follow one another. They are gone; this replaces them properly.
// `tsHi` HAS TO MOVE WITH `MOVE.sprint` OR THE FEET SLIDE. The run clip is scaled by
// `speed / runRef`, so a sprint ceiling of 9 x 1.95 = 17.6 m/s wants 3.7x and the cap decides
// what he actually gets. 1.7 was already under the OLD ceiling of 14 -- he has been sliding at
// full charge for a while -- and 2.4 covers 11.5 m/s honestly and keeps the rest readable.
// There is no sprint clip; that is the real fix, and `run_fwd` at 3.7x is a cartoon scramble,
// so this is deliberately short of keeping up rather than absurdly past it.
const GAIT = { walkAt: 1.5, runAt: 6.0, walkRef: 1.55, runRef: 4.8, tsLo: .7, tsHi: 2.4, windUp: '' };
const SK8 = {
  pushV: 5.4,        // m/s added by one shove
  // THE PUSH CLIP IS THE CLOCK. It is not a pose to blend in and out of -- it is a whole
  // cycle, ride to push to ride, and holding the stick forward should simply loop it. The
  // shove fires at the point in that cycle where his foot is actually on the road, so the
  // physics answers to the animation rather than the other way round.
  // KICKING OFF IS NOT CRUISING. A skater leaving a dead stop takes three or four quick
  // hard pushes and only settles into the long cycle once he is rolling. One fixed 1.55 s
  // cycle meant the first shove landed instantly and the second a second and a half later,
  // so the first 10 m/s took five seconds of standing on a moving plank. The cycle is a
  // function of speed now and THE CLIP IS TIME-SCALED TO MATCH IT, so the foot still meets
  // the road on the frame the shove fires -- which is the whole point of the clip being
  // the clock, and the reason this is not just a bigger number in pushV.
  pushDur: 1.55,     // the cruising cycle, matching skate_push_standing
  pushFast: .60,     // the cycle at a dead stop -- the clip runs 2.6x through it
  pushEase: 16,      // the speed by which it has stretched back to pushDur
  shoveDur: .40,     // how long one shove is spread over -- see `shove` in stepSkate
  pushPlant: .42,    // where in the cycle the foot shoves
  // PUSHING KEEPS PAYING, JUST LESS. Each shove gives less the faster he is already going
  // while drag takes more, so speed BUILDS over a long stretch and settles near 20 m/s
  // instead of being cut off at a number. A short street will not get him there.
  // THE CEILING IS FOUR NUMBERS, NOT ONE, and raising pushV alone would not have moved it.
  // Top speed is where one shove per cycle exactly pays for the drag over that cycle, so it
  // is set by pushV, the taper on it, and BOTH drags together -- and pushMax gates pushing
  // outright on top of all of it. 22 with a .45 taper meant the shove was down to half
  // strength at 12 m/s and he settled around 16; he was fighting his own taper long before
  // he was fighting the air. Now: 10 m/s in .9 s, 20 in 6.5, settling near 26 (94 km/h),
  // and a coast from the top down to 8 takes sixteen seconds, which is the other half of
  // what fast means -- speed you keep.
  pushMax: 32,
  taper: .36,        // how much of a shove the speed he already has takes off it
  brake: 9,          // m/s^2 with the stick pulled back
  drag: .052,        // rolling resistance, per second
  air: .0016,        // quadratic air drag
  grip: 7,           // how fast sideways velocity dies (carve vs slide)
  // Under this, the stick held against his travel stops being a brake and becomes a push in
  // the new direction -- which is what dragging a foot to a stop and then shoving off the
  // other way actually is, done with one input.
  fakieAt: 2.2,
  // HE DOES NOT PUSH BACKWARDS. A fakie push looks like nonsense with no fakie clip to play,
  // so asking the board to lead with its tail spins him round on it instead: a half cab, on
  // `turn_left`/`turn_right`, and then he is riding forward again. The heading turns; the
  // VELOCITY does not, so he keeps his line through it and comes out rolling the way he was.
  // Delete this the day switch clips land -- riding fakie is a real thing to be able to do.
  turnDur: .7,
  turnLag: 1.15,     // radians the deck trails him by at the middle of a half cab
  // THE SCUFF OF BRUSHING SOMETHING. resolveBoxes already removes only the component going
  // INTO a surface, so a slide along a car keeps its speed on its own. This is the scrape
  // on top of that, and it used to be `vel *= .7` EVERY FRAME -- an exponential with a
  // tenth-of-a-second half life, so the lightest touch of a wing was a dead stop, and it
  // got worse the higher the frame rate. Per second now, and gentle.
  scuff: 1.2,
  // PINBALL OFF A WALL. resolveBoxes only ever removed the component going INTO a surface,
  // which is right for a slide and completely wrong for meeting a building square: all of his
  // speed was normal to it, all of it was deleted, and he stopped. Restitution sends that
  // component back out instead. The tangential part is untouched either way, so a shallow
  // graze along a shopfront costs nothing and a square hit comes off it at half speed.
  bounce: .52,

    const g = groundAt(x, z, P.my + 2, 1.5);
    w.skin.root.visible = true;
    w.skin.root.position.set(x, g.hit ? g.floor : hmAt(x, z), z);
    w.skin.root.rotation.z = 0;
    // LINEAR, not eased. The clip is time-scaled to this speed, so any easing at the ends is
    // the feet sliding on the road; the arrival is sold by the turn and the blend instead.
    const sg = (w.to > w.from ? 1 : -1);
    const head = Math.atan2(P.rx * sg, P.rz * sg);
    if (k >= 1 && w.lead) {
      w.settle += dt;
      const f = Math.min(1, w.settle / P.set), e = f * f * (3 - 2 * f);
      w.skin.root.rotation.y = head + wrapAngle(TITLE.face - head) * e;
      skinWeights(w.skin, { idle_neutral: e, walk_fwd_neutral: (1 - e) * (1 - run), run_fwd: (1 - e) * run }, dt);
      if (f >= 1) { P.walk.splice(i, 1); wear(w.skin.key); }
    } else {
      w.skin.root.rotation.y = head;
      skinScale(w.skin, 'walk_fwd_neutral', tsW); skinScale(w.skin, 'run_fwd', tsR);
      skinWeights(w.skin, { walk_fwd_neutral: 1 - run, run_fwd: run }, dt);
      if (k >= 1) { w.skin.root.visible = false; P.walk.splice(i, 1); }
    }
    // the current skin's mixer is already advanced by the frame loop; everybody else's is not
    if (w.skin.mixer !== colin.mixer) w.skin.mixer.update(dt);
  }
  // THE DECK STAYS ON THE MARK. It belongs to whoever is standing there, and there is only one
  // of it -- handing it between two people who are ten metres apart is a teleport. It stands
  // itself up on the road instead and waits, which is what a board does.
  board.visible = true;
  _bt.set(P.mx + P.rx * .5, P.my + BOARD.len * .5, P.mz + P.rz * .5);
  board.position.x = damp(board.position.x, _bt.x, .1, dt);
  board.position.y = damp(board.position.y, _bt.y, .1, dt);
  board.position.z = damp(board.position.z, _bt.z, .1, dt);
  board.rotation.set(-Math.PI / 2, TITLE.face + TITLE.yaw, 0, 'YXZ');
  return true;
}
function titleFrame(dt) {
  TITLE.t += dt;
  // NO SEE-THROUGH HOLE ON THE CARD. It exists so a building between the play camera and him
  // does not hide him, and on a held title shot it is a dither storm across the picture --
  // which is what it was, because the sway walks the lens into the house behind him.
  HOLE.on = 0;
  // He stands where he SPAWNS. That is the point of doing the card in the live scene: START
  // is a camera move and not a teleport, so the street on the card is the street he starts in.
  player.vel.set(0, 0, 0); player.speed = 0; player.heading = player.faceH = TITLE.face;
  if (colin.ready && !stepParade(dt)) { colinSet({ idle_neutral: 1 }, dt); poseColin(dt); titleBoard(); }
  camAim(TITLE.az + Math.sin(TITLE.t * TITLE.rate * Math.PI * 2) * TITLE.sweep, TITLE.el,
         TITLE.dist * (1 + Math.sin(TITLE.t / TITLE.breatheT * Math.PI * 2) * TITLE.breathe), TITLE.look);
}
// The descent into the playing rig. Slow at both ends so it reads as an arrival, not a cut.
function diveFrame(dt) {
  TITLE.dive = Math.max(0, TITLE.dive - dt);
  const k = 1 - TITLE.dive / TITLE.diveT, e = k * k * (3 - 2 * k);
  // round to BEHIND him: the follow camera looks along his facing, so that is where az lands.
  camAim(TITLE.az0 + wrapAngle(player.faceH - TITLE.az0) * e, lerp(TITLE.el0, CAM.el, e),
         lerp(TITLE.dist0, CAM.dist, e), lerp(TITLE.look0, CAM.look, e));
  // The deck stays in his hand THROUGH the descent and only goes away once the camera has
  // arrived. Dropping it on the press pops it out of frame dead centre, which is the one
  // moment he is looking straight at it. The hook for "he starts ON the board" is here:
  // set `player.board = true` in startGame and this line becomes a handover rather than a cut.
  if (!player.board) titleBoard();
  if (TITLE.dive <= 0) { cam.idle = 0; board.visible = player.board; }
}
HOLE.was = HOLE.on;   // the card turns the hole off; this is what it turns back on
const titleEl = document.getElementById('title');
function startGame() {
  if (!TITLE.on || !ready) return;
  TITLE.on = false; TITLE.dive = TITLE.diveT;
  TITLE.az0 = cam.az; TITLE.el0 = TITLE.el; TITLE.dist0 = TITLE.dist; TITLE.look0 = TITLE.look;
  // THE BUTTON IS THE GESTURE, and that is worth more than the button. A browser will not
  // build an AudioContext outside one, so until now the first ollie was also the thing that
  // started the decode. `SFX.init` fetches, decodes and puts the theme on, all off one press
  // he was always going to make.
  SFX.wake();
  HOLE.on = HOLE.was;
  player.jump = 0; player.charge = 0; player.rHold = 0;   // nothing held over the card is spent on entry
  stick.L.x = stick.L.y = stick.R.x = stick.R.y = 0; for (const k in keys) keys[k] = 0;
  titleEl.classList.add('go'); setTimeout(() => titleEl.remove(), 900);
  document.body.classList.remove('title');
}
document.getElementById('startB').addEventListener('click', startGame);
// SWIPE THE CARD TO CHANGE HIM. On `window` with capture, because `#title` is pointer-events
// none by design -- it must never eat a thumb -- and the sticks underneath are off while the
// card is up, so there is nothing else here to argue with. A swipe LEFT pulls the next one in
// from the right, which is the way every row of things on a phone works.
{
  let sx = 0, sy = 0, sid = null;
  addEventListener('pointerdown', e => {
    if (!TITLE.on || (e.target && e.target.closest && e.target.closest('button'))) return;
    sid = e.pointerId; sx = e.clientX; sy = e.clientY;
  }, true);
  addEventListener('pointerup', e => {
    if (sid !== e.pointerId) return; sid = null;
    if (!TITLE.on) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4) return;   // a drag down the screen is not a swipe across it
    cycleChar(dx < 0 ? 1 : -1);
  }, true);
  addEventListener('keydown', e => {
    if (!TITLE.on) return;
    if (e.key === 'ArrowRight') cycleChar(1);
    else if (e.key === 'ArrowLeft') cycleChar(-1);
  });
}
{
  const row = document.getElementById('chars');
  for (const ch of CHARS.list) {
    const b = document.createElement('button'); b.textContent = ch.name; b.dataset.key = ch.key;
    if (ch.key === CHARS.cur) b.classList.add('on');
    b.addEventListener('click', e => { e.preventDefault(); pickChar(ch.key); });
    row.appendChild(b);
  }
}

function stepCam(dt) {
  // in the air on the board that pad is spending its travel on tricks, not on the lens
  const rx = (player.board && !player.grounded) ? 0 : stick.R.x;
  if (Math.abs(rx) > .05) { cam.az -= rx * CAM.yawRate * dt; cam.idle = 0; }
  else cam.idle += dt;
  const sp = player.speed;
  // AND IT DOES NOT CHASE HIM ROUND EITHER. The auto-follow is what makes riding pleasant
  // on the ground, and it is exactly what makes a spin unreadable in the air: he turns, the
  // lens turns with him, and nothing appears to have happened except that you are dizzy.
  // Off the ground the camera holds still and lets him rotate in front of it.
  if (player.board && !player.grounded) cam.idle = 0;
  else if (cam.idle > CAM.idle && sp > .8) {
    const want = sp > 1.2 ? Math.atan2(player.vel.x, player.vel.z) : player.faceH;
    cam.az += wrapAngle(want - cam.az) * Math.min(1, CAM.follow * dt * clamp(sp / 5, .3, 1.4));
  }
  cam.el = CAM.el;
  const dist = CAM.dist + sp * CAM.distV;
  cam.tgt.set(player.pos.x, player.pos.y + CAM.look, player.pos.z);
  const ce = Math.cos(cam.el);
  const wx = cam.tgt.x - Math.sin(cam.az) * ce * dist, wy = cam.tgt.y + Math.sin(cam.el) * dist, wz = cam.tgt.z - Math.cos(cam.az) * ce * dist;
  if (cam.pos.lengthSq() === 0) cam.pos.set(wx, wy, wz);
  cam.pos.x = damp(cam.pos.x, wx, CAM.half, dt); cam.pos.y = damp(cam.pos.y, wy, CAM.half, dt); cam.pos.z = damp(cam.pos.z, wz, CAM.half, dt);
  const floor = hmAt(cam.pos.x, cam.pos.z) + .6; if (cam.pos.y < floor) cam.pos.y = floor;
  camera.position.copy(cam.pos); camera.lookAt(cam.tgt);
  cam.rush = damp(cam.rush, clamp((sp - 8) / 18, 0, 1), .25, dt);   // saturated at 20; the top is 26 now
  camera.fov = CAM.fov + cam.rush * CAM.fovRush; camera.updateProjectionMatrix();
  compMat.uniforms.uRush.value = cam.rush * .6;
  sky.position.copy(camera.position);
  // the sun's shadow box rides with him
  sun.position.copy(player.pos).addScaledVector(LIGHT.sunDir, 160); sun.target.position.copy(player.pos);
}

// ---------- HUD ----------
const speedEl = document.getElementById('speed').querySelector('b');
const buildEl = document.getElementById('build'), buildNEl = document.getElementById('buildN'), perfEl = document.getElementById('perf');
let fpsT = 0, fpsN = 0, fps = 0;
buildNEl.textContent = BUILD; buildEl.classList.add('fresh');
buildEl.style.cursor = 'pointer';
buildEl.addEventListener('click', () => { DBG = (DBG + 1) % 10; applyDbg(); });

// WHICH BUILD IS ON THE GLASS, and whether it is the newest one.
// Pages puts a ten-minute cache on index.html and an iOS home-screen app holds it
// harder than that, so "has it reloaded yet" is a real question that the running
// copy cannot answer about itself -- it will always report the build it IS.
// version.json is rewritten by tools/bump.mjs on every push, and this asks the
// SERVER for it past the cache, so the game finds out about its own successor.
const updEl = document.getElementById('upd');
let updSeen = null;
async function checkUpdate() {
  try {
    // The query string is the point: a distinct URL is a cache miss at every hop,
    // which a no-store header alone does not buy you on a CDN.
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = await r.json();
    if (v.build && v.build !== BUILD && v.build !== updSeen) {
      updSeen = v.build; updEl.hidden = false; updEl.textContent = 'build ' + v.build + ' ready · tap';
    }
  } catch (e) { /* offline, or no version.json yet: nothing worth saying */ }
}
updEl.addEventListener('click', () => location.replace(location.pathname + '?v=' + Date.now()));
setInterval(checkUpdate, 15000);
addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
checkUpdate();

// ---------- frame ----------
const clock = new THREE.Clock();
let ready = false;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  if (!ready) return;
  toonSync();
  // The card runs the WHOLE scene -- traffic, clouds, his mixer, the post chain. Only the
  // player is suspended, and only because he is being posed rather than driven.
  if (TITLE.on) titleFrame(dt); else stepPlayer(dt);
  stepTraffic(dt);
  stepClouds(dt);
  WHEELS.set(player.speed, !TITLE.on && player.board && player.grounded && !player.hit, !!player.rail && SFX.on);
  if (TITLE.dive > 0) diveFrame(dt); else if (!TITLE.on) stepCam(dt);
  stepHole();
  blobStep();
  drawMap(dt);
  if (colin.mixer) colin.mixer.update(dt);
  renderPost();
  fpsN++; fpsT += dt; if (fpsT > .5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; perfEl.textContent = fps + ' fps · ' + renderer.info.render.calls + ' dc' + dbgInfo + missing(); }
  speedEl.textContent = Math.round(player.speed * 3.6);
}
frame();

// ---------- go ----------
(async () => {
  try {
    let city;
    try { city = await loadGLB('models/city.glb', 'loading the city'); }
    catch (e) { console.warn('no baked city, loading the source', e); city = await loadGLB('LowPoly_City_01.glb', 'loading the source city'); }
    setBoot('building the streets', 1);
    await new Promise(r => setTimeout(r, 30));
    let ramps = null;
    try { ramps = await loadGLB(PARK.url, 'building the park'); }
    catch (e) { console.warn('no ramps', e); }
    try { buildBoard(await loadGLB(BOARD.url, 'shaping the board')); }
    catch (e) { console.warn('no board model, keeping the procedural one', e); }
    buildCity(city, ramps);
    buildLadders();
    {
      const got = [];
      for (const u of CLOUDS.urls) { try { got.push(await loadGLB(u, 'loading the sky')); } catch (e) { /* that one is not here */ } }
      if (got.length) buildClouds(got); else console.warn('no cloud models found');
    }
    // THE BORROWED CLIPS GO INTO THE SAME POOL COLIN'S OWN ARE IN, so every skin picks them up
    // through `skinClips` unchanged -- the same filter, the same HIPFIX, no second path. They
    // are already rotation-only (see `npm run melee`), which is what makes that safe: Colin
    // takes the pool raw, and an alien's position tracks would stretch him to alien lengths.
    let melee = null;
    try { melee = await loadGLB(MELEE.url, 'learning to fight'); }
    catch (e) { console.warn('[melee] no melee.glb -- punches and the roll will be missing', e); }
    setBoot('waking colin', 1);
    try { const c = await loadGLB('models/colin.glb', 'loading colin'); buildColin(c, melee && melee.animations); } catch (e) { console.warn('colin failed', e); }
    const sg = groundAt(player.pos.x, player.pos.z, 60, 0);
    player.pos.y = sg.hit ? sg.floor : hmAt(player.pos.x, player.pos.z); player.safe.copy(player.pos);
    buildMap();
    ready = true;
    document.getElementById('boot').classList.add('off');
    titleEl.classList.add('on');
    // whoever he was last time, fetched now rather than on the boot path: the card shows
    // Colin until it arrives, and the chip stays lit for the one it is waiting on.
    try { const k = localStorage.getItem(CHARS.key); if (k && k !== 'colin' && CHARS.list.some(c => c.key === k)) pickChar(k, 1, 1); } catch (e) {}
  } catch (e) { console.error(e); bootErr.textContent = 'could not load: ' + (e && e.message || e); }
})();
window.city = { TITLE, PARADE, MELEE, HANG, LAD, LADDERS, startGame, CHARS, pickChar, cycleChar, BOARD, MAP, HOLE, PARK, GRIND, RAILS, SFX, MUSIC, WHEELS, snd, TRICK, STRIDE, TOON, COLINM, SKY, CLOUDS, ENV, HIT, ROLL, clouds, SK8, MOVE, GAIT, CAM, POST, LIGHT, SHADOW, SHADE, BLOB, sun, player, cam, cars, tiles, solids, hmAt, renderer, scene, camera, compMat, cityGroup, colin };
</script>
</body>
