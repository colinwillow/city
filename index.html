<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shredworld</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- THE VERSION IS IN THE FILENAME AND NEVER IN A QUERY STRING. iOS drops an
     apple-touch-icon link whose href carries a `?` -- so the cache-buster that was meant to
     make the new icon arrive is what made NO icon arrive, and the home screen fell back to a
     screenshot. A new filename is a new URL with no query: it beats the icon cache without
     tripping that. Even so iOS only re-reads it when the shortcut is removed and re-added. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v3.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167-v3.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152-v3.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v3.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512-v3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shredworld">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- TWO VOICES, AND FREDOKA WAS NEITHER. It is a rounded friendly face -- soft terminals,
     wide counters, no edge -- which against spray-paint key art reads exactly as he put it:
     like a three-year-old's. The art carries the personality, so the HUD does not have to
     shout; it has to look like it belongs on the same poster.
       BUNGEE is urban signage: squared, heavy, built to be read small and from an angle. It
       is the street voice, and it goes on the few BIG things -- the button, the pill, the
       panel headings -- where personality is wanted and there is room for it.
       BARLOW CONDENSED does the work: keys, labels, the diagnostic chip, the speedo. Condensed
       is the point -- `JETPACK` has to fit inside a 58 px key and the build chip has to carry
       `c103 · 29 FPS · 203 DC · ★★ · JET OUT · JAM 117@430,178` on one line of a phone.
     `display=swap` so a font on a slow connection can never hold the first paint. -->
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--disp:'Bungee',system-ui,sans-serif;--ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
    --ink:#eaf6ff;--rim:rgba(157,247,255,.45);
    /* the poster's own palette, so the HUD and the art are the same object */
    --hot:#ff4fd8;--sun:#ffb43c;--sky:#57e8ff}
  /* touch-action:manipulation is what actually kills iOS double-tap-to-zoom. The viewport
     meta does not: Safari honours user-scalable=no for pinch and ignores it for the tap. */
  html,body{touch-action:manipulation;margin:0;height:100%;background:#0b1020;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--ui);color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* ---- boot card ---- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(circle at 50% 40%,#182a52,#0b1020 70%);z-index:20;transition:opacity .5s}
  #boot.off{opacity:0;pointer-events:none}
  /* HIS KEY ART, AND IT FADES IN RATHER THAN BLOCKING. 2.65 MB is not something to hold the
     first paint on: the gradient and the bar are up on the first frame the way they always
     were, and the poster arrives over the top of them whenever it arrives. `object-position`
     is biased ABOVE centre because the art is portrait and the logo is at the top of it -- a
     landscape phone crops the vertical, and centred it would take the wordmark off. */
  #bootArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;
    opacity:0;transition:opacity .45s ease-out}
  #bootArt.lit{opacity:1}
  /* THE STAND-IN WORDMARK, and BUNGEE IS WIDE. Ten heavy squared letters at 38px with .18em
     of tracking overflows a phone; the display face carries the personality and the SIZE has
     to come down to pay for it. Clamped on viewport width so it never touches the edges. */
  #boot h1{position:relative;font-family:var(--disp);font-size:clamp(20px,7.2vw,34px);letter-spacing:.01em;margin:0;
    text-transform:uppercase;color:#f4ecd8;
    text-shadow:0 3px 0 rgba(10,26,58,.9),0 0 30px rgba(120,238,255,.45);transition:opacity .3s}
  #boot h1.gone{opacity:0}          /* the art carries its own wordmark; this is the stand-in */
  /* The bar sits UNDER the art rather than across it, on a scrim, so it never crosses a face */
  #boot .foot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:0 20px calc(30px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(6,9,22,.72) 42%,rgba(6,9,22,.9))}
  #boot .bar{width:min(240px,62vw);height:6px;border-radius:3px;background:rgba(157,247,255,.2);overflow:hidden;margin-top:66px}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee7ff,#e8fbff);transition:width .15s}
  #boot .msg{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #boot .err{color:#ffb4b4;font-size:13px;max-width:80vw;text-align:center;white-space:pre-wrap;opacity:.9}
  /* ---- title card ----
     THE PICTURE BEHIND IT IS THE GAME. Plutopia builds a whole second scene for its title
     (`DIO.*`) because its world is procedural and the card wants a thing that does not exist
     in play. This one already has the shot in it -- he is stood in the street with his board,
     the traffic is running, the clouds are going over -- so the card is the ordinary scene
     and the ordinary post chain with a different CAMERA, and this is only type on glass. */
  #title{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:16px;padding:0 24px calc(48px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;transition:opacity .8s ease}
  /* pointer-events only once it is VISIBLE. #title is none throughout, so an invisible
     button over the boot card cannot be pressed -- which it could, and it started the
     game underneath the loading screen. */
  #title.on{opacity:1}
  #title.on #startB{pointer-events:auto}
  #title.go #startB{pointer-events:none}
  #title.go{opacity:0;transition:opacity .45s ease}
  /* HIS WORDMARK, NOT TYPE. No font sets that -- it is drawn, outlined, spattered and has a
     planet in it. It arrives with a transparent background, so the only work here is size and
     a shadow to lift it off the street behind it.
     WIDTH IS CAPPED IN BOTH AXES. The art is 2129x739, near 3:1, so sizing it on width alone
     puts it off the top of a landscape phone; `max-height` in vh is what stops that, and the
     two together mean one rule covers both ways round. */
  #title .word{margin:0 0 auto;padding-top:calc(26px + env(safe-area-inset-top));
    width:min(92vw,720px);max-height:34vh;object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(4,10,24,.65)) drop-shadow(0 0 42px rgba(120,238,255,.3));
    animation:wordIn .9s cubic-bezier(.16,1,.3,1) both}
  @keyframes wordIn{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
  #title .sub{font-size:12.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;opacity:.75;
    text-shadow:0 2px 10px rgba(0,0,0,.7)}
  #startB{touch-action:manipulation;cursor:pointer;border:0;font-family:var(--disp);
    font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#1a0730;
    padding:16px 46px;border-radius:14px;background:linear-gradient(180deg,var(--sun),#ff8a2b);
    box-shadow:0 6px 0 #a33f00,0 14px 30px rgba(8,18,38,.5),0 0 34px rgba(255,180,60,.4);
    animation:startPulse 2.4s ease-in-out infinite}
  /* A HARD BOTTOM EDGE RATHER THAN A BLUR. The poster's letters are drawn with a flat shadow
     under them, and a soft glow under the button sits in a different world from that. */
  #startB:active{animation:none;transform:translateY(4px);box-shadow:0 2px 0 #a33f00,0 6px 16px rgba(8,18,38,.5)}
  @keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  /* WHO HE IS, AS A NAME RATHER THAN AS A ROW OF BUTTONS (c143).
     *"I don't want the buttons. I just wanna be able to click on the character, or swipe left,
     swipe right, and whoever's name is selected."* The characters ARE the menu -- they are
     standing right there -- so a row of pills under them was a second, worse copy of a control
     the picture already had. It also drew the eye away from the thing being chosen.
     The plate is an IMAGE first and type second, for the wordmark's own reason: no font sets
     what he draws, and a pill in a UI face next to spray-paint key art reads as a web form.
     Until his art lands, the display face at a size nothing else on the card uses. */
  #charName{position:relative;height:clamp(40px,9vh,74px);display:flex;align-items:center;justify-content:center;pointer-events:none}
  #charArt{max-width:min(78vw,520px);max-height:100%;object-fit:contain;display:none;
    filter:drop-shadow(0 4px 0 rgba(4,10,24,.55)) drop-shadow(0 0 26px rgba(120,238,255,.28))}
  #charArt.lit{display:block}
  #charTxt{font-family:var(--disp);font-size:clamp(20px,5.6vw,34px);letter-spacing:.02em;text-transform:uppercase;
    color:#fff;text-shadow:0 4px 0 rgba(4,10,24,.6),0 0 30px rgba(120,238,255,.4)}
  #charArt.lit + #charTxt{display:none}
  /* A NAME THAT CUTS IS A NAME THAT LOOKS LIKE A BUG. It fades through the change, which is
     also what covers the beat where a skin is still coming down the wire. */
  #charName.busy{animation:startPulse 1s ease-in-out infinite}
  #charName.swap #charArt,#charName.swap #charTxt{opacity:0}
  #charArt,#charTxt{transition:opacity .16s}
  /* THE HUD DOES NOT EXIST UNTIL HE HAS PRESSED IT -- except the build badge, which is how he
     tells one build from the one before it and is wanted MOST on the first screen. */
  body.title #sticks,body.title .key,body.title #map,body.title #speed,body.title #help{opacity:0;pointer-events:none}
  /* ---- sticks (from Plutopia) ---- */
  #sticks .stick{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;z-index:4;touch-action:none;
    background:radial-gradient(circle,rgba(157,247,255,.10),rgba(157,247,255,.03) 58%,rgba(157,247,255,0) 74%);
    border:1.5px solid rgba(157,247,255,.26);box-shadow:inset 0 0 26px rgba(120,238,255,.08);transition:border-color .18s,box-shadow .18s}
  #sticks .stick.act{border-color:rgba(157,247,255,.62);box-shadow:inset 0 0 30px rgba(120,238,255,.16),0 0 18px rgba(120,238,255,.16)}
  #sticks .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 32%,rgba(255,250,236,.72),rgba(246,232,204,.34) 58%,rgba(110,170,196,.18));
    border:1px solid rgba(246,232,204,.55);box-shadow:0 0 10px rgba(157,247,255,.22),inset 0 1px 3px rgba(255,255,255,.32);transition:transform .06s linear,box-shadow .18s}
  #sticks .stick.act .knob{box-shadow:0 0 22px rgba(157,247,255,.55),inset 0 1px 3px rgba(255,255,255,.45)}
  #sticks .lbl{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font-family:var(--disp);text-transform:uppercase;
    font-size:9px;letter-spacing:.06em;color:var(--ink);opacity:.5}
  #stkL{left:calc(20px + env(safe-area-inset-left))} #stkR{right:calc(20px + env(safe-area-inset-right))}
  /* ---- round keys ---- */
  .key{position:fixed;width:62px;height:62px;border-radius:50%;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center;
    color:var(--ink);border:1.5px solid var(--rim);font:700 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;
    background:radial-gradient(circle at 40% 32%,rgba(157,247,255,.13),rgba(10,14,40,.52) 62%,rgba(10,14,40,.62));
    box-shadow:0 3px 0 rgba(6,14,34,.7),0 8px 18px rgba(0,0,0,.45),inset 0 0 18px rgba(120,238,255,.06);
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .07s linear,box-shadow .18s,border-color .18s}
  /* A FLAT EDGE UNDERNEATH, NOT A BLUR -- the poster's letters are drawn with a hard shadow
     under them, and a soft halo sits in a different world from that. Pressing one takes the
     edge away, which is the whole animation and costs nothing. */
  .key:active{transform:translateY(3px);box-shadow:0 0 0 rgba(6,14,34,.7),0 4px 10px rgba(0,0,0,.4)}
  .key.on{border-color:var(--sky);color:#fff;
    box-shadow:0 3px 0 rgba(6,14,34,.7),0 8px 18px rgba(0,0,0,.45),0 0 22px rgba(120,238,255,.45),inset 0 0 22px rgba(120,238,255,.22)}
  /* THE KIT IS THREE PLAIN KEYS IN A ROW, NOT A MENU. The radial fan was one button doing
     two jobs -- tap to toggle, press-and-hold to choose -- and a long press is a gesture you
     have to be told about. Three keys say what they are just by being on screen, and a tap is
     a tap. ABOVE the sticks, because they are 132 px wide and 20 px from each edge: on a phone
     that leaves about 110 px between them, which will not hold three keys at any size worth
     pressing. The band over them is empty and both thumbs reach it. */
  /* A ZERO-SIZE ANCHOR ON THE RIGHT STICK'S OWN CENTRE (c168), so the keys ride the same
     safe-area insets the pad does and cannot drift from it on a notched phone: 20 px in plus
     half of 132, and 26 px up plus the same. Each key is then placed by `KIT.slots[].at` --
     one `right`/`bottom` pair per key, written once in `kitBuild`. */
  #kitRow{position:fixed;width:0;height:0;
    right:calc(86px + env(safe-area-inset-right));
    bottom:calc(92px + env(safe-area-inset-bottom));
    z-index:4;pointer-events:none}
  #kitRow .key{position:absolute;width:58px;height:58px;flex-direction:column;gap:2px;pointer-events:auto}
  #kitRow .key i{font-style:normal;font-size:20px;line-height:1}
  #kitRow .key u{text-decoration:none;font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.8}
  #kitRow .key.on u{opacity:.95}
  /* AN INVISIBLE BUTTON IS STILL A BUTTON. `body.title .key` fades every key out on the title
     card, but the `#kitRow .key` rule above wins on specificity for `pointer-events` -- so
     without this the three keys would still take a thumb through the card at opacity 0, which
     is the `#startB` landmine one element over. */
  body.title #kitRow .key{pointer-events:none}
  /* THE RETICLE, PLUTOPIA'S. Four layers turning at different rates round one centre: a
     dashed ring, a set of arrows the other way, brackets that breathe, a diamond that pulses.
     Turning IS the whole trick -- a static mark reads as a dead overlay, and nothing here has
     to be recomputed per frame for it because CSS animation runs off the compositor.
     `pointer-events:none` without exception: it sits in the middle of the play area. */
  #retic{position:fixed;z-index:5;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;
    pointer-events:none;will-change:transform,opacity;transition:opacity .16s,filter .2s}
  #retic[hidden]{display:none}
  #retic svg{width:100%;height:100%;display:block;overflow:visible;
    filter:drop-shadow(0 0 5px rgba(120,238,255,.8))}
  /* transform-box:view-box so the origin is the viewBox's own middle rather than each group's
     tight bounding box, which would spin every layer about a different point. */
  #retic svg g,#retic svg path{transform-box:view-box;transform-origin:32px 32px}
  .rA{animation:reticspin 7s linear infinite}
  .rB{animation:reticspin 4.2s linear infinite reverse}
  .rC{animation:reticbrk 1.5s ease-in-out infinite}
  .rD{animation:reticdia 1.5s ease-in-out infinite}
  @keyframes reticspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes reticbrk{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(.9);opacity:1}}
  @keyframes reticdia{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.1);opacity:.95}}
  /* LOCKED IS A DIFFERENT MARK, not a brighter one. It goes warm, the brackets snap in and
     hold rather than breathing, and the whole thing tightens -- so "the gun has something" and
     "the gun is pointed at dirt" are told apart at a glance rather than by comparing
     brightness to a memory of what it looked like a second ago. */
  #retic.lock{filter:drop-shadow(0 0 9px rgba(255,180,60,.95))}
  #retic.lock svg{transform:scale(.84)}
  #retic.lock .rA{animation-duration:2.6s}
  #retic.lock .rC{animation:none;transform:scale(.78)}
  #retic.lock .rD{animation-duration:.5s}
  #retic.lock circle,#retic.lock path{stroke:rgba(255,206,120,.95)}
  #retic.lock path[fill]{fill:rgba(255,222,150,.95)}
  /* The charge, wound round the right stick: it is the one thing on screen that says how big
     the shot you are about to take is, and it belongs where the thumb already is. */
  #sticks .stick .chg{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;
    background:conic-gradient(rgba(198,156,255,.9) calc(var(--c,0) * 360deg),rgba(198,156,255,0) 0);
    -webkit-mask:radial-gradient(circle,transparent 66%,#000 69%);mask:radial-gradient(circle,transparent 66%,#000 69%)}
  #resetB{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;font-size:16px}
  /* TWO KEYS, NOT A MODE (c170). The note is the MUSIC and the speaker is the EFFECTS, and
     they are separate because a screen recording wants one and not the other -- see `musicSet`.
     The note stays where the old all-sound key was, and on the glyph he already reads as music,
     so the button he thought muted the music is now the button that mutes the music. */
  #musicB{top:calc(14px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right));width:40px;height:40px;font-size:15px}
  #sfxB{top:calc(14px + env(safe-area-inset-top));right:calc(110px + env(safe-area-inset-right));width:40px;height:40px;font-size:14px}
  #map{position:fixed;top:calc(62px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:116px;height:116px;border-radius:14px;z-index:4;pointer-events:none;
    border:1.5px solid rgba(157,247,255,.30);box-shadow:0 4px 16px rgba(0,0,0,.45)}
  /* ---- the settings panel ---- */
  #gearB{top:calc(14px + env(safe-area-inset-top));right:calc(158px + env(safe-area-inset-right));width:40px;height:40px;font-size:17px}
  #opt{position:fixed;z-index:9;top:calc(62px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:min(280px,calc(100vw - 28px));max-height:calc(100vh - 110px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:12px 14px 14px;border-radius:16px;border:1.5px solid rgba(157,247,255,.34);
    background:rgba(8,12,34,.93);box-shadow:0 10px 34px rgba(0,0,0,.6);
    font:600 12px/1.3 var(--ui);letter-spacing:.04em;color:var(--ink);-webkit-tap-highlight-color:transparent}
  #opt[hidden]{display:none}
  #opt h4{margin:12px 0 6px;font-family:var(--disp);font-size:9px;letter-spacing:.04em;text-transform:uppercase;opacity:.55;color:var(--sky)}
  #opt h4:first-child{margin-top:0}
  #opt .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
  #opt .row span{flex:1;text-transform:uppercase;font-size:11.5px;letter-spacing:.05em;opacity:.85}
  #opt .row b{min-width:34px;text-align:right;font-size:11.5px;color:var(--sky);font-weight:700}
  #opt input[type=range]{flex:0 0 108px;width:108px;height:26px;accent-color:#8ef0ff;background:transparent}
  #opt .seg{display:flex;gap:6px}
  #opt .seg i{font-style:normal;padding:5px 9px;border-radius:9px;border:1px solid rgba(157,247,255,.28);
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.6}
  #opt .seg i.on{border-color:rgba(157,247,255,.95);background:rgba(120,238,255,.16);color:#fff;opacity:1}
  #opt .tog{padding:5px 11px;border-radius:9px;border:1px solid rgba(157,247,255,.28);font-size:9.5px;
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.6}
  #opt .tog.on{border-color:rgba(157,247,255,.95);background:rgba(120,238,255,.16);color:#fff;opacity:1}
  /* ---- chips ---- */
  .chip{position:fixed;z-index:4;font:600 12px/1.15 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);opacity:.72;
    padding:7px 10px;border-radius:999px;border:1px solid rgba(157,247,255,.22);background:rgba(10,14,40,.45);backdrop-filter:blur(6px)}
  #build{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));opacity:1;padding:6px 12px}
  #build b{font-family:var(--disp);font-size:15px;letter-spacing:0;color:var(--sky);text-shadow:0 2px 0 rgba(8,20,44,.9),0 0 14px rgba(120,238,255,.7)}
  #build i{font-style:normal;font-size:11px;opacity:.6;margin-left:8px;letter-spacing:.04em}
  /* Three slow pulses on load. The question this answers is "did it actually reload",
     and a number that looks identical whether it changed or not cannot answer it. */
  #build.fresh{animation:fresh 1.5s ease-out 3}
  @keyframes fresh{0%,100%{border-color:rgba(157,247,255,.22);box-shadow:none}
    45%{border-color:rgba(157,247,255,.95);box-shadow:0 0 26px rgba(120,238,255,.8),inset 0 0 18px rgba(120,238,255,.3)}}
  /* The newer build is on the server and this one is not it. */
  #upd{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;z-index:6;border:0;cursor:pointer;
    font:400 11px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;color:#1a0730;padding:12px 17px;border-radius:12px;
    background:linear-gradient(180deg,#a6f4ff,#49cdec);box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 26px rgba(120,238,255,.55);
    animation:updp 1.5s ease-in-out infinite}
  @keyframes updp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  /* THE SPEEDO SAT ON TOP OF THE BUILD CHIP AND ATE THE THING THE BUILD CHIP IS FOR.

import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';
import { clone as skelClone } from './vendor/SkeletonUtils.js';

const BUILD = 'c180';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1400);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
// frame-rate independent smoothing: how far toward the target in one half-life

const wrapAngle = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
const smooth = (a, b, x) => { const t = clamp((x - a) / ((b - a) || 1e-6), 0, 1); return t * t * (3 - 2 * t); };

// ---------- tuning ----------
// LOCOMOTION, ported from Plutopia, where this has actually been through the mill.
// Three separate ideas, and the moonwalk comes from missing the third.
//
// 1. THE GATHER IS IN HIS LEGS, NOT IN THE TARGET. `push` is how much of his
//    acceleration he currently HAS: it starts at push0 and reaches all of it over pushT
//    seconds of continuously asking, and falls back at pushOut rather than resetting, so
//    a step, a pause and another step is not three standing starts. On top of it accFall
//    thins the acceleration out again as he nears top speed, so the first units come
//    quickly and the last take their time. He genuinely walks, then jogs, then runs.
//
// 2. FACING IS NOT HEADING. `heading` is the thumb's direction, taken instantly.
//    `faceH` is where his body actually points, and it comes round more slowly the
//    faster he is going: quick on the spot, an arc at a run, because a running man arcs.
//
// 3. AND THE LEGS PUSH WHERE HIS FEET ARE PLANTED. Below plantAt the push goes where the
//    thumb says, so a standing start goes where you point. Above plantFull it goes along
//    HIS OWN FACING, so facing and travel cannot come apart and the only way to change
//    direction at a run is to turn through it. This is the part I had missing, and its
//    absence is exactly the moonwalk: without it the velocity keeps answering to the
//    stick while the body has already swung round, so he faces one way and travels
//    another. A hard turn also costs him speed, which is what plants the feet rather
//    than merely pointing them.
//
// Steering is split from acceleration as well: `turn` caps how fast the velocity can be
// pushed SIDEWAYS, separately from how fast it can be lengthened.
const MOVE = {
  max: 9, acc: 24, accFall: .93, drag: 46,
  push0: .30, pushT: .85, pushOut: 2.6,
  airAcc: 11, airDrag: 1.2,
  // HOLD THE RIGHT PAD ON FOOT AND HE WINDS UP. The same thumb that taps to jump: held, it is
  // a sprint AND a charge, and letting go is a jump scaled by how long you held it. One input
  // doing two things that belong together -- you run at something and leap it.
  chargeMax: .9,     // seconds to a full wind-up
  sprint: 3.0,       // top speed multiplier at full charge: 9 -> 27 m/s, 97 km/h. HIS pick,
                     // off the panel, once the acceleration could actually reach it.
  chargeUp: .42,     // extra jump SPEED at full charge, as a fraction
  chargeOut: 5.0,    // and how much he is thrown along his travel, m/s
  turn: 26, airTurn: 9,
  face0: 11, face1: 5.2,
  plantAt: 2.2, plantFull: 6.5,
  turnBrake: .42,
  // Exaggerated on purpose: ~2.8 m of apex and a full second of air, so there is room for
  // the going-up and coming-down clips to actually read as two different things.
  jump: 10.6, g: 20, dead: .12, curve: 1.4, step: .55, coyote: .12,
};
// GAIT. Three clips at once, weighted by how fast he is ACTUALLY travelling, so the
// blend is a consequence of the speed rather than a second decision about it. Each
// clip's clock is tied to the ground speed as well, so the feet do not skate.
// THE LANDING ROLL OWNS HIM UNTIL IT IS DONE. It was given .42 s of weight out of a
// 1.6 s clip, so it was cut off before he was halfway round. It now holds for the clip's
// OWN duration, read off the clip rather than guessed, and while it runs the stick does
// nothing: a roll carries you forward a couple of metres and stops, it does not steer.
// That is also what stops the slide -- there is no target velocity to chase, only the
// carry the roll itself implies, falling away as he comes back to his feet.
// He rolls THROUGH the landing at the speed he arrived with. It was a fixed 4.6 decaying
// quadratically, which is about two metres over a second and a half -- a roll on the spot.
// Coming out of a run he should cover five or six, so the speed he had in the air is what
// carries him, bled off linearly over the clip.
// free is the tail of the roll that belongs to YOU. The clip still plays whole, but once
// he is past this much of it the stick takes over and he runs out of it, instead of
// standing about finishing a last half second nobody is watching.
// `rate` speeds the landing roll up. The clip is 1.60 s at 1x, which reads as a beat too long
// on the way out of a jump; at 1.25 it was 1.28 and STILL read long, so it is 1.70 -- 0.94 s,
// which is about what a real tuck-and-up takes. It has to move as a PAIR with rollDur -- the
// roll's speed bleed is `rollT / rollDur`, so a clip played faster than the timer it is
// measured against comes to a stop and then slides. `rollDur` is derived from `rate` two
// hundred lines down, which is what makes that pairing automatic rather than remembered.
const ROLL = { at: -7, min: 4, max: 10, free: .42, rate: 1.70 };
// `windUp` is the on-foot crouch, and it is EMPTY until there is a clip for it. Name one here
// and colinAnim blends it in on the GROUND, by how loaded `p.charge` is, while he is holding
// the right pad. That is where the two `*_jump_init` clips were always trying to be: they are
// crouches, and they were being played in the AIR for the first .19 s of the flight, which is
// two poses that do not follow one another. They are gone; this replaces them properly.
// `tsHi` HAS TO MOVE WITH `MOVE.sprint` OR THE FEET SLIDE. The run clip is scaled by
// `speed / runRef`, so a sprint ceiling of 9 x 1.95 = 17.6 m/s wants 3.7x and the cap decides
// what he actually gets. 1.7 was already under the OLD ceiling of 14 -- he has been sliding at
// full charge for a while -- and 2.4 covers 11.5 m/s honestly and keeps the rest readable.
// There is no sprint clip; that is the real fix, and `run_fwd` at 3.7x is a cartoon scramble,
// so this is deliberately short of keeping up rather than absurdly past it.
// `sprint` IS THE HOOK FOR A SPRINT CLIP AND IT IS EMPTY UNTIL THERE IS ONE, exactly like
// `windUp`. Name a clip here and `colinAnim` blends it in over `run_fwd` as he passes
// `sprintAt`, on its own reference speed -- which is the honest fix for the feet. Until then
// `run_fwd` is time-scaled and `tsHi` is the ceiling: at a 27 m/s sprint the clip wants 5.6x
// and gets 2.9, so the feet do slide at the very top. A run clip played at 5.6x is a cartoon
// scramble, so the cap is deliberately short of keeping up rather than absurdly past it, and
// the CAMERA is what sells the speed instead (`CAM.rush`).
const GAIT = { walkAt: 1.5, runAt: 6.0, walkRef: 1.55, runRef: 4.8, tsLo: .7, tsHi: 2.9,
  windUp: '', sprint: '', sprintAt: 11, sprintRef: 7.5 };
const SK8 = {
  pushV: 5.4,        // m/s added by one shove
  // THE PUSH CLIP IS THE CLOCK. It is not a pose to blend in and out of -- it is a whole
  // cycle, ride to push to ride, and holding the stick forward should simply loop it. The
  // shove fires at the point in that cycle where his foot is actually on the road, so the
  // physics answers to the animation rather than the other way round.
  // KICKING OFF IS NOT CRUISING. A skater leaving a dead stop takes three or four quick
  // hard pushes and only settles into the long cycle once he is rolling. One fixed 1.55 s
  // cycle meant the first shove landed instantly and the second a second and a half later,
  // so the first 10 m/s took five seconds of standing on a moving plank. The cycle is a
  // function of speed now and THE CLIP IS TIME-SCALED TO MATCH IT, so the foot still meets
  // the road on the frame the shove fires -- which is the whole point of the clip being
  // the clock, and the reason this is not just a bigger number in pushV.
  pushDur: 1.55,     // the cruising cycle, matching skate_push_standing
  pushFast: .60,     // the cycle at a dead stop -- the clip runs 2.6x through it
  pushEase: 16,      // the speed by which it has stretched back to pushDur
  shoveDur: .40,     // how long one shove is spread over -- see `shove` in stepSkate
  pushBlend: .018,   // how fast the push clip comes up -- see `BLENDIN`. .055 is a sixth of a
                     // second to be visible, and the scrape has already been heard by then.
  pushGrace: .45,    // let go and take the stick again inside this and the CYCLE CARRIES ON
                     // rather than restarting -- see `stepSkate`. A jiggled thumb is not four
                     // pushes, and restarting the phase is what made it sound like four.
  // WHERE IN THE CYCLE THE FOOT IS ACTUALLY ON THE ROAD -- MEASURED (`npm run push`), and for
  // every build until c171 THIS CONSTANT WAS NEVER READ BY ANYTHING. The shove, and the scrape
  // that is the sound of it, fired at the TOP of the cycle, where his foot is still up on the
  // deck. Half a cycle before the push, which at a 1.55 s cruise is 0.72 s: *"the sound is in
  // the in-between space."* He is describing the gap exactly.
  // Per clip, because the two are authored differently and one number would be wrong for one of
  // them; keyed by name so a re-export measures again rather than inheriting a guess.
  pushPlant: { skate_push_standing: .46, skate_push_crouch: .56 },
  // PUSHING KEEPS PAYING, JUST LESS. Each shove gives less the faster he is already going
  // while drag takes more, so speed BUILDS over a long stretch and settles near 20 m/s
  // instead of being cut off at a number. A short street will not get him there.
  // THE CEILING IS FOUR NUMBERS, NOT ONE, and raising pushV alone would not have moved it.
  // Top speed is where one shove per cycle exactly pays for the drag over that cycle, so it
  // is set by pushV, the taper on it, and BOTH drags together -- and pushMax gates pushing
  // outright on top of all of it. 22 with a .45 taper meant the shove was down to half
  // strength at 12 m/s and he settled around 16; he was fighting his own taper long before
  // he was fighting the air. Now: 10 m/s in .9 s, 20 in 6.5, settling near 26 (94 km/h),
  // and a coast from the top down to 8 takes sixteen seconds, which is the other half of
  // what fast means -- speed you keep.
  pushMax: 32,
  taper: .36,        // how much of a shove the speed he already has takes off it
  brake: 9,          // m/s^2 with the stick pulled back
  drag: .052,        // rolling resistance, per second
  air: .0016,        // quadratic air drag
  grip: 7,           // how fast sideways velocity dies (carve vs slide)
  // Under this, the stick held against his travel stops being a brake and becomes a push in
  // the new direction -- which is what dragging a foot to a stop and then shoving off the
  // other way actually is, done with one input.
  fakieAt: 2.2,
  // HE DOES NOT PUSH BACKWARDS. A fakie push looks like nonsense with no fakie clip to play,
  // so asking the board to lead with its tail spins him round on it instead: a half cab, on
  // `turn_left`/`turn_right`, and then he is riding forward again. The heading turns; the
  // VELOCITY does not, so he keeps his line through it and comes out rolling the way he was.
  // Delete this the day switch clips land -- riding fakie is a real thing to be able to do.
  turnDur: .7,
  turnLag: 1.15,     // radians the deck trails him by at the middle of a half cab
  // THE SCUFF OF BRUSHING SOMETHING. resolveBoxes already removes only the component going
  // INTO a surface, so a slide along a car keeps its speed on its own. This is the scrape
  // on top of that, and it used to be `vel *= .7` EVERY FRAME -- an exponential with a
  // tenth-of-a-second half life, so the lightest touch of a wing was a dead stop, and it
  // got worse the higher the frame rate. Per second now, and gentle.
  scuff: 1.2,
  // PINBALL OFF A WALL. resolveBoxes only ever removed the component going INTO a surface,
  // which is right for a slide and completely wrong for meeting a building square: all of his
  // speed was normal to it, all of it was deleted, and he stopped. Restitution sends that
  // component back out instead. The tangential part is untouched either way, so a shallow
  // graze along a shopfront costs nothing and a square hit comes off it at half speed.
  bounce: .52,
  turnLo: 3.2, turnHi: 1.25,   // yaw rate at a crawl / at speed (rad/s)
  ollie: 12.6, g: 20,   // a big ollie: about 4 m
  // THE POP. He was launching on the frame your thumb came up, so there was nothing to
  // see: no crouch, no load, just a man suddenly higher. This is the wind-up. It is brief,
  // and the crouch clip runs fast through it so it reads as a compression, then he goes.
  pop: .13,
  // AIR YAW BEATS GROUND YAW, and by a lot. On the ground the wheels are what he is
  // steering and it is rate-limited to turnLo/turnHi; in the air there is nothing holding
  // him, so holding the stick over spins him on the spot -- a 360 in about .7 s at full
  // deflection. This is the manual spin, and it is why the flick does not need to do one.
  spin: 9.5,         // air yaw rate with the stick
  lean: .5,          // visual roll per unit steer
  step: .42,         // curb height the wheels roll up
  bailAng: 1.15,     // landing more sideways than this scrubs the speed
  pivot: 1.6,        // yaw rate standing still on the board
};
// AIR TRICKS, AND THE GESTURE IS A FLICK RATHER THAN A DRAG. The pad already knew the
// difference -- FLICK.at past .72 of its travel inside 280 ms -- and it was never wired to
// anything. A slow drag is still the camera. Up is a front flip, down is a back flip (the
// two clips that have been sitting unused), left and right are procedural, because a shuv
// does not need a clip and there isn't one. WHILE HE IS IN THE AIR ON THE BOARD THE RIGHT
// PAD IS TRICKS AND NOT THE CAMERA, or a spin flick whips the lens round with it. On the
// ground nothing about that pad has changed.
// How far he goes between footfalls. A taste number; the only thing that makes it wrong is a
// foot landing visibly out of time with the sound, which is what a stride is for.
const STRIDE = { walk: 1.5, run: 2.3 };
const TRICK = {
  // BOARD TRICKS ARE PURE GEOMETRY. The deck runs along its local Z, so a kickflip is a
  // roll about Z and a shove-it is a yaw about Y, and a varial is both at once. None of
  // them need a clip, which is why they can exist today: Colin holds the air pose and the
  // board does the work under him.
  flip: 18,          // rad/s of roll: a kickflip in about .35 s
  shove: 16,         // rad/s of yaw: a 360 shove in about .39 s
  land: .80,         // a body flip less far along than this when he touches is not landed
  bail: .45,         // what an unlanded trick costs him
  pivot: .95,        // the height a body flip turns about, which carries the board round
  rest: .14,         // how fast the board settles back under him after a landing
  // HOW MUCH OF THE FLIP CLIP A BOARD TRICK PLAYS (c180). *"We could probably shave some off the
  // end of the flip animation, because he lands on the ground and we don't want it... he's above
  // the skateboard, it's just floating below him."* `front_flip` and `back_flip` are STANDING
  // flips: they open with a crouch (which is what `TRIM.back_flip` already cuts off the front)
  // and they CLOSE with a landing recovery on the floor. On foot that tail is exactly right and
  // `airStart` plays the whole clip. On a board it is a man landing in mid-air -- the clip's own
  // hips translation stands him up out of his stance while the deck stays where his feet were,
  // which is the deck floating below him.
  // **BOARD ONLY, AND THAT IS WHY IT LIVES IN `trickFlip`** rather than in the clip or in `TRIM`:
  // `trickFlip` is the board's entry point and `airStart` is the foot's, so the two bodies get
  // the two readings of the same clip with nothing to keep in step.
  // Delete this the day there is a board flip clip that ends in a stance.
  tail: .82,
  // A BARREL ROLL IS GEOMETRY TOO -- there is no clip for one, so he holds the ordinary air
  // pose and the WHOLE of him turns about his own forward axis, the board carried round with
  // him. `colin.root.rotation.z` is already that axis: the root is Euler XYZ, so Z is applied
  // innermost, in his own frame, and he faces +Z in his file. It is the same channel `lean`
  // uses, which is the proof it is the right one -- leaning into a turn IS a roll about
  // forward, only smaller.
  roll: true,
  // A ROLL OWNS THE AIR. Hold left or right and he spins (a yaw); FLICK it and he rolls --
  // but the pad's history is seeded at the CENTRE on pointerdown, so a thumb SLAMMED to the
  // edge to start a hard spin is, by the detector's own definition, also a flick. That is
  // not a bug to work around, it is the same gesture: so the roll goes first and the yaw is
  // held off until it finishes, after which the still-held thumb spins him as it always did.
  rollLock: true,
};
// LADDERS. Where the jumps cannot reach. `npm run ladders` finds them rather than anybody
// placing one by eye: every building taller than a charge jump into a double can already grab
// (8.04 m of apex plus 2.15 of grab window = 10.2), with a wall face that has FLAT OPEN GROUND
// in front of it, sampled off the same land and road meshes the collider is built from. A
// ladder whose foot is in the water or up the inside of a wall is what placing by eye gets you.
// PLUTOPIA'S SHIP, PARKED ON A ROOF (c127). *"Maybe it's on a roof somewhere."*
// ON HOTEL_A, AND THAT IS NOT AN ARBITRARY ROOF: `npm run ladders` already put a LADDER up that
// building, and until now it topped out on a bare 14 x 14 m deck with nothing on it. A climb
// that leads somewhere is worth more than a ship on a roof you cannot reach -- and the deck
// centre is MEASURED (298.2, 17.1, -13.1), not picked off a screenshot, for the same reason
// `npm run spots` exists.
// ITS SIZE IS MEASURED TOO, the skateboard's rule: it arrives about a unit across, so the scale
// comes from its own long horizontal axis and a re-export at any size lands right with no edit.
// MONEY YOU PICK UP (c144, `CASH`, `buildCash`, `stepCash`).
// *"Money that you collect -- a stack of hundred dollar bills with a little [band] to signal
// that it's like $10,000. Put it around town, just a little bit here and there."*
// **THE BANK STRAP IS THE WHOLE READ**, and it is why this is worth generating rather than
// modelling: a green brick is a green brick from ten metres, and the one thing that says MONEY
// at that distance is the paper band across the middle. So the silhouette is four plates with a
// hair of gap (which is what says "bills" rather than "block") under one bright band that wraps
// proud of the stack on two axes. Sixty triangles.
// **PLACED BY `npm run spots 2 spread 26`, NEVER BY EYE** -- this repo's oldest rule, and
// `spread` is the sort that exists for exactly this: `spots` ranks nearest-first, which is right
// for a half pipe he has to find and would have put twenty-six straps in a rank in his face.
// Farthest-point sampling instead: one within a walk of the spawn and the rest from 148 m to
// 770 m out, so finding them is a reason to cross town.
// **NOT YET: the arrest.** *"I'm thinking the cops will try to arrest you and when you get
// arrested you lose all your money. You don't need to implement that stuff yet."* `CASH.lose()`
// is the hook and nothing calls it; `HEAT` is already the wanted level it will read.
const CASH = {
  on: 1,
  // `npm run spots 2 spread 26`, pasted. Every one reads flat 0.00 and good 100 per cent --
  // open ground rather than a road -- and they run from 6 m to 770 m from the spawn.
  spots: [
    [-95,-1], [591,337], [399,-137], [-391,337],
    [165,337], [-391,-87], [-113,283], [189,53],
    [591,61], [391,199], [-307,125], [105,-137],
    [591,-133], [5,147], [361,31], [-233,-77],
    [321,337], [253,-87], [239,195], [-261,267],
    [-145,141], [561,199], [487,-31], [455,319],
    [5,337], [113,219]
  ],
  bank: 0, got: 0, shown: 0, // what he is carrying, how many straps, and the ticking display

  // the picture a third of a second before the hand gets there, and a swing and its
  // consequence arriving as two separate events is exactly what "you cannot actually hit
  // things" looks like from outside. `at` is the fraction of the move the blow lands on,
  // per clip, because a round kick connects later in its arc than a jab does.
  // AND THE CONTACT FRACTIONS ARE PLUTOPIA'S TOO -- `MELEE.hit`, which it measured against its
  // own clips, and these are the same clips: .32, .48, .31, .19. A round kick connecting at
  // half way through was my guess; .31 is what the clip actually does.
  at: { melee_punch_01: .32, melee_slash: .48, melee_round_kick: .31, slide: .19 },
  // WHERE IT SITS, likewise derived from Plutopia rather than picked: it draws at
  // `MELEE.reach * .62` out of a 3.4 reach on a 2.8 m body, which is .753 of his height, and
  // `RIG.height * .58` up. Mine were .95 and .62 -- a mark half a body too far out and too
  // high, which is most of "they're not lined up well".
  fxY: .58, fxR: .753,
  url: 'models/chars/melee.glb',
  roll: 'roll',      // the left pad's flick: a dodge, and the only i-frames in the game
  rollV: 9.5,
  hold: .55,         // of each strike he cannot steer out of; after that the stick has him back
};
// ---------- THE KIT, THE BLASTER AND THE JETPACK ----------
// ONE BUTTON, NOT THREE. Plutopia's arrangement, and the reason it is worth copying: a phone
// has two thumbs and a HUD full of them is a HUD you cannot play through. The key does what
// the Board key used to do -- TAP and the thing in your hand goes on or off -- and PRESS AND
// HOLD fans the rest of the kit out round it on an arc. Slide onto one, let go, and that is
// what is in your hand; no second tap, and no lifting off in between. The whole gesture is
// ONE pointer stream on the key, captured, so the slots never receive an event of their own:
// the thumb is OVER the arc rather than on it, and hit-testing the rects is what "over" means.
// A ring winds round the key while the hold counts, because otherwise a long press and a slow
// tap are the same thing right up until one of them surprises you.
// EVERY SLOT IS ITS OWN SWITCH. It used to be `cur` + `on` -- one thing in his hand and
// whether it was out -- which made the kit a RADIO BUTTON: taking the blaster put the jetpack
// away, and there was no arrangement of presses that gave you both.
// *"I want to be able to use the accessories at the same time."* So there is no current slot
// any more; there are three booleans and a key each. That also deletes a whole class of bug by
// construction, because `cur` was the thing `toggleBoard` and `dropBoard` kept writing to (see
// below) -- a variable that no longer exists cannot have three owners.
const KIT = {
  out: { board: 0, blaster: 0, jet: 0 },
  // ROUND THE RIGHT STICK, ON ITS OWN CIRCLE (c168). *"Put the skateboard directly above the
  // right stick and the blaster directly to the left of it, and the jetpack in the middle of
  // those two -- if you were to draw a greater circle around the right stick they all land on
  // that circle. The blaster is at 9 o'clock and the skateboard is at 12."*
  // `at` is that clock position as an ordinary angle: 90 is twelve o'clock, 180 is nine. The
  // jetpack is the BISECTOR at 135 (half past ten) rather than the 150 he called it -- "in the
  // middle of those two" is the instruction and an even arc is what it draws; `at: 150` is one
  // number if he wants it tighter to the blaster.
  // **THE RADIUS CLEARS BOTH PADS, AND THAT IS ARITHMETIC RATHER THAN TASTE.** The pads are
  // 132 px wide and 20 px in, so the stick's centre is 86 px from the right edge and its rim is
  // 66 px out; a 58 px key needs 29 more. At `ring` 110 the keys clear the right pad by 15 px,
  // and the nine o'clock one lands 13 px clear of the LEFT pad on a 390 px phone held portrait,
  // which is the tightest case this layout has.
  ring: 110,
  slots: [
    { k: 'board', label: 'Board', ico: '\u{1F6F9}', at: 90 },
    { k: 'jet', label: 'Jetpack', ico: '\u{1F680}', at: 135 },
    { k: 'blaster', label: 'Blaster', ico: '⚡', at: 180 },
  ],
  key: 'city.kit',
};
// THE BLASTER. Plutopia's trigger, whole, because three separate things in it each rule out a
// different way of firing by accident and dropping any one of them brings that way back:
//   fireAt   how far up the pad it arms -- a long way, so a nudge cannot reach it
//   keepAt   and how far back DOWN it has to slide to stand down again. The gap between the
//            two is hysteresis: a thumb rolling inward as it lifts off must not cancel the
//            shot you meant, and without it a full pull only fires if you let go at exactly
//            full stretch, which nobody does
//   armT     and how long it has to be up there. A flick to the top and straight back is not
//            a shot however far it went -- which is also what keeps the melee flick alive
//   fireArc  how far off straight up the stick may be and still be a trigger
// That last one is what lets this share the pad with everything already on it: a TAP is still
// a jump (`far` never reaches .80), a hold near the middle is still the sprint and the
// charge-jump, and only a deliberate push UP is the trigger.
const WEAP = {
  // RIDING, HE TURNS THE GUN WITHOUT TURNING THE BOARD (c126). `stepSkate` owns the heading --
  // the wheels are what steer -- so the aim has never been allowed to touch `p.heading` while
  // riding, and the shot goes where the reticle says while his BODY goes on facing down the
  // deck. That is correct physics and it looks wrong: the barrel and the mark disagree.
  // The fix is the one he asked for: pivot the spine. It is applied AFTER the mixer, as a
  // rotation about the WORLD Y axis conjugated into each bone's parent frame -- so it is
  // rig-agnostic (a mixamo spine bone's own local axes are nobody's idea of up) and it stacks
  // on whatever the clip was already doing instead of fighting it.
  // SPINE1 AND SPINE2 ONLY, never the hips: the legs belong to the board and must not come
  // round with the gun. `max` is how far he will twist before the shot simply goes where he is
  // not looking -- a man does not turn 180 degrees at the waist.
  // `fix` CLOSES THE LOOP ON THE BARREL ITSELF, which is the only thing that actually matters:
  // see `aimTwist`. `fixMax` IS SIZED TO THE POSE BIAS AND NO MORE (measured at 21-23 deg, so
  // .45 rad = 26 covers it with margin). It has to be bounded, and tightly: an integrator with
  // a long leash does not respect `max` at all -- it just keeps winding until the barrel is on
  // the mark, and at .9 it twisted him ONE HUNDRED AND TEN DEGREES at the waist to make a
  // ninety-degree shot line up. Past the clamp the barrel is meant to lag the reticle, because
  // a man cannot turn that far; the SHOT still leaves on `p.aimH` either way (c119), so what is
  // lost there is the look of it and never the accuracy.
  flash: 'plasma',  // 'plasma' | 'tight' | 'card' | 'both' -- see `muzzleFlash`
  twist: { on: 1, max: 1.15, ease: .10, fix: 6.0, fixMax: .45, bones: [/spine2$/i, /spine1$/i] },
  // HIS OWN BLASTER, AND IT CARRIES THE JOINTS. Measured through gltf-transform: geometry
  // -65.6..7.4 on X (so the barrel runs along -X, 0.73 m long at its armature's 0.01), with
  // `weapon_root` at the origin and `weapon_tip` 56.2 units down the barrel -- the same pair
  // `pistol.glb` is built round. So the MUZZLE is a node here, not a guess, and the day Colin
  // has a weapon joint the whole hand placement below stops being hand-nudged as well.
  url: 'models/blaster.glb',
  // HOW FAST THE MARK FOLLOWS. Small enough that a real sweep of the thumb arrives inside a
  // tenth of a second, big enough to swallow a kerb sampled a centimetre either way.
  aimEase: .045,
  // AND THE HEIGHT EASES FAR HARDER THAN THE BEARING (c175). *"There's like a little flicker up
  // and down -- I don't know if it's catching onto things farther away. Maybe just ease that, or
  // remove the up-down motion."* The remaining jitter is not noise and it is not the lock (which
  // has been off since c136): it is REAL and it is DISCONTINUOUS. One frame the walk stops at a
  // kerb and `y` is the kerb's foot; the next it clears and `y` is the road forty metres on. A
  // jump in the world, so no finer probe can remove it -- only a filter can.
  // The mark's JOB is to say where the shot lands in PLAN. Its height is a detail, and it is the
  // only axis a pitched-down camera turns into visible bobbing, so it gets its own half-life.
  aimEaseY: .22,
  // HOW STEADY THE BEARING IS (c175). *"I want the aim to be a little less sensitive -- it's hard
  // on a small device to aim really precisely."* The pad is ABSOLUTE: the thumb's bearing IS the
  // world bearing, so at the top of a 132 px pad ten pixels sideways is nine degrees, and at
  // forty metres that is six metres of miss. Lowering a GAIN is not available -- there is no gain,
  // and inventing one breaks "you point where you point", which is the whole c101 mechanic.
  // So the mapping is untouched and the RESULT is damped: the same bearing, arrived at over a
  // breath instead of instantly. A shaky thumb stops showing; a real sweep still lands in a
  // tenth of a second. 0 is the old behaviour exactly.
  aimSmooth: .075,
  fireAt: .80, keepAt: .50, armT: .10, fireArc: 1.05,
  cool: .42,            // seconds between shots
  chargeT: .9,          // a full charge takes this long
  min: .35,             // and a shot loosed early is this fraction of one
  // WHERE THE BOLT ACTUALLY LEAVES HIM, and Plutopia's note is the reason both exist: a bolt
  // born ON the gun is born inside whatever he is standing next to and bursts on it at once,
  // and the gun is on his body, which eases onto the aim -- so on a flick-and-release the
  // barrel still points where he WAS while the bolt already flies where the stick pointed.
  // Clear of him, chest high, ON the shot line. (Its 1.6/.62 on a 2.8 m alien -> 1.0/.62.)
  out: 1.0, high: .62,
  // PLUTOPIA'S, AND THEY ARE THE MECHANIC RATHER THAN A TASTE SETTING.
  aimAt: .32,           // stick magnitude that is an aim rather than a nudge. ANY direction
                        // past this turns him -- that is how you look around with the gun out
  camEase: 2.6,         // how briskly the camera swings in BEHIND the aim
  aimTurn: 2.3,         // and the ceiling on it, radians a second: uncapped the feedback loop
                        // runs at four and is unsteerable
  // THE ASSIST LIVES IN WHETHER SOMETHING LOCKS, NOT IN HOW FAR TOWARD IT THE SHOT GETS.
  // A 22-degree cone is narrow enough that pointing at open ground locks nothing and the bolt
  // goes exactly where the stick pointed -- but once the reticle is ON something, the shot has
  // to go to it, or the mark is drawing a promise the gun does not keep, which is worse than
  // no assist at all. `grab` is how far of the way there it settles and `pull` the rate, so it
  // is a lead-on and never a snap.
  // `range` is Plutopia's 70 x .625, the borrowed-length rule; every other number here is a
  // fraction or a rate and comes over raw.
  // THE ASSIST IS OFF BY DEFAULT (c136). *"It keeps locking onto everything and it won't be what
  // you're trying to shoot at -- it finds something in the distance and it glitches."*
  // Plutopia's numbers are right FOR PLUTOPIA, where the things worth shooting are sparse. This
  // city is four hundred cars and eight officers inside a 44 m radius, so a 22-degree cone
  // almost always contains SOMETHING -- and the mark snapping between two of them at forty
  // metres is the glitching. An assist that is always on is not an assist, it is a hand on the
  // wheel; the honest version here is a reticle that goes where the thumb points and a bolt
  // that goes to the reticle.
  // NOTHING IS DELETED. `on: 1` brings the whole loop back exactly as it was -- `pickTarget`,
  // the accumulating ease, the wider keep-cone, all of it -- for the day this game has a
  // fight worth assisting in.
  // BACK ON, POLICE ONLY, AND SUBTLE (c175). *"I'm toying with re-adding a small aim assist, but
  // only on players like the cop -- no cars. It's an assist, not a complete lock: if your aim
  // isn't super precise but you're just to the left or right of him, it'll lock onto him."*
  // **THE CARS WERE THE WHOLE c136 COMPLAINT.** Four hundred of them inside a 44 m radius is why
  // a 22-degree cone always contained SOMETHING and why the mark snapped between two of them at
  // forty metres. Eight officers is a different world: `cops` only, and the cone and the range
  // come down as well, so it helps where he is pointing and nowhere else.
  //     cone  .38 -> .24    22 deg -> 14, about "just to the left or right of him"
  //     range  44 -> 34     and a bolt only reaches so far anyway
  //     grab  .58 -> .85    SEE BELOW -- this is what makes the promise keepable
  lock: { on: 1, cops: 1, cone: .24, range: 34, pull: 4.0, grab: .85, taper: .45, keep: .55 },
  // RIDING, THE WHOLE LOOP IS LIVELIER AND IT READS AS THE AIMER ZIPPING ABOUT. Two things
  // feed it and both are speed: the camera sweeps in behind the aim while he is ALSO being
  // carried across the ground at twenty metres a second, so a target's bearing changes on its
  // own before the thumb has moved -- and the assist then chases that moving bearing.
  // So the same loop runs slower on the board. Multipliers rather than a second set of
  // numbers, so the day `camEase` or `grab` is retuned this follows instead of drifting out of
  // agreement with it. `grab` is the one to take toward 0 if he decides he wants a plain
  // standing reticle that does not lead at all -- the lock stays, it just stops pulling.
  ride: { camEase: .55, aimTurn: .55, grab: .55, pull: .6 },
  len: .30,             // the blaster's length in his hand, measured to, not typed
  // Where it sits in his hand. NOT derived: Colin has no weapon bone (his rig is 66 joints and
  // every one of them mixamorig), so nothing in either file says where the grip goes. The
  // barrel runs along -X in the blaster's own file -- measured, geometry -74.9..25.0 on X --
  // and a hand joint's forward is +Z, which is the quarter turn `ry` starts at.
  fit: { x: 0, y: 0, z: 0, rx: 0, ry: Math.PI / 2, rz: 0, s: 1 },
  // AND THE NUDGE FOR WHEN THE RIG *DOES* CARRY THE JOINT (c158). *"The blaster is not being
  // held correctly, so I corrected all the joints -- I've done this four times now."* His fix
  // DID land and DID move `weapon_root`; what it could not do is be judged, because the only
  // way to move the gun was another export. Identity by default -- so this is a dial and never
  // a correction applied behind his back -- and it is in the settings panel, because where a
  // gun sits in a hand is a LOOK-AT-IT decision and this panel is the half of the tuning that
  // exists for those. `city.grip()` nudges it live and prints the line to keep.
  // POINT THE BARREL AT `weapon_tip` (c165). *"You're rigging the blaster based on the rotation
  // of the blaster root, but if you were to attach the blaster to the root and then point it at
  // the tip, then you would get the perfect rotation."* He is right, and the two files say by
  // how much -- `npm run gunpose` reads both barrel axes:
  //     colin.glb    weapon_root -> weapon_tip   (0.064, -0.945, 0.320)   nearly straight DOWN
  //     blaster.glb  weapon_root -> weapon_tip   (-0.985, 0.000, 0.174)   along -X
  //     between them: NINETY DEGREES
  // Parenting with identity carries the blaster's own convention onto his joint and throws the
  // second joint away entirely -- so `weapon_tip` was only ever read for the muzzle FLASH, and
  // the thing it is actually for, which is the DIRECTION, was never used. Five re-exports could
  // not have fixed that: his joints were right the whole time and the mount ignored one of them.
  // Aligning the measured axis is `barPlace`'s rule one mount along, and it means the export
  // stops being something this code has an opinion about.
  aimTip: 1,
  grip: { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0, s: 1 },
  // THE ARMED GAIT, AND THE HOOK IS FILLED. `clip` was a name with nothing reading it, written
  // the way `GAIT.sprint` is -- and the c96 export lands the clips: six `rifle_*` animations in
  // the same commit as the weapon joint, which is not a coincidence. A man carrying a blaster
  // does not walk with his arms swinging, so while it is OUT the whole gait is the armed one
  // and `rifle_shoot_stationary_01` plays on the shot. It costs no new control and it is gated
  // on the kit, so an empty name or a missing clip falls straight back to the ordinary gait.
  clip: 'rifle_shoot_stationary_01',
  aimPose: 'rifle_aim',  // built at load from that clip's FIRST KEY -- see buildColin
  fireHold: .42,        // how long the shoot clip owns the body, scaled to fit
  idle: 'rifle_idle_01', walk: 'rifle_walk_fwd_01', run: 'rifle_run',
  // AIMING IS ITS OWN SET, AND IT IS WHAT THE STRAFES WERE ALWAYS FOR. While the trigger is
  // held he faces the shot and travels wherever the thumb says (`plant` is zero, see stepFoot),
  // so the legs cannot be picked by speed alone -- they are picked by the ANGLE BETWEEN where
  // he is going and where he is pointing. Forward is `rifle_run_aim`, sideways is the strafe
  // for that side, and standing still is the idle.
  aimRun: 'rifle_run_aim', strafeL: 'rifle_strafe_left', strafeR: 'rifle_strafe_right',
  // RETREATING. A clone of `aimRun` built at load and played at a NEGATIVE time scale, so his
  // feet go the way he is actually travelling. It was empty and the forward clip played while
  // he backed away, which is a moonwalk with a rifle.
  aimBack: 'rifle_run_back',
  aimRunRef: 5.33, strafeLRef: 4.36, strafeRRef: 4.57,
  // THESE TWO WERE TYPED AND BOTH WERE WRONG; `npm run gait` MEASURES THEM.
  // A clip is time-scaled by `speed / ref`, so one cycle takes `dur * ref / speed` seconds --
  // which means a borrowed clip of a DIFFERENT LENGTH needs its own reference to put the feet
  // down at the same rate: `ref = GAIT.ref * (colinDur / thisDur)`. The rifle clips are not
  // the same length as Colin's own:
  //     run       rifle_run      0.700 s vs run_fwd 0.667   -> 4.8 * 0.953 = 4.57
  //     run aim   rifle_run_aim  0.600 s vs run_fwd          -> 4.8 * 1.112 = 5.33
  //     walk      rifle_walk     1.333 s vs walk_fwd 1.067   -> 1.55 * 0.800 = 1.24
  //     strafe    0.733 / 0.700 s vs run_fwd                 -> 4.36 and 4.57
  // The two strafes differ by 5% and get their own number, because the last time a value here
  // was eyeballed it came out wrong in BOTH directions at once (4.4 against 6.00 and 1.7
  // against 1.24) and cost a build. `npm run gait` prints all of them.
  walkRef: 1.24, runRef: 4.57,
};
// THE BOLT. It rides a fixed height above whatever is under it rather than flying a straight
// line, which is Plutopia's rule and the reason a shot goes over a kerb instead of burying
// itself in the first one. `stun` is the plasma part: a car it touches is dead in the road
// for that long, lights arcing over it, and the traffic rules route round it because a
// stopped car is something they already know how to handle.
// PLUTOPIA'S NUMBERS, SCALED. Its alien is 2.8 m and Colin is 1.75, so every length here is
// its value times .625 -- the speed, the sizes and the blast all keep their relationship to
// the body that fires them, which is the only way a borrowed effect reads the same.
//     speed 76 -> 48   rad 2.2 -> 1.4   size 3.4 -> .55 (the sprite stack is sized off it)
//     ride 2.6 -> 1.1  climb 44 -> 28   fall 13 -> 8   grace 1.8 -> 1.1
// `zaps` and `trail` are COUNTS, not lengths, so they come over unchanged: seven crackle pips
// and twelve streak sprites are what the shot is made of.
const BOLT = {
  speed: 48, life: 2.2, rad: 1.4, ride: 1.1, climb: 28, fall: 8, grace: 1.1,
  size: .55, zaps: 7, trail: 12,
  stun: 2.6,
  hue0: '#7fe6ff', hue1: '#c69cff',
};
// THE JETPACK. Thrust against gravity while the pad is held, out of a tank that fills again
// on the ground. `up` is deliberately over `MOVE.g` so he climbs while it burns, and `cap`
// is what stops that being a launch: it is a ride.
const JET = {
  url: 'models/alien_jetpack.glb',
  // PLUTOPIA'S, SCALED. `up` keeps its RATIO to gravity (46 against 32 there = 1.44, so 28.8
  // against this game's 20) -- that ratio is what "he climbs while it burns" means, and a
  // number copied across two different gravities means something else. Lengths take the same
  // .625 the bolt does: cap 15 -> 9.4, drift 5.5 -> 3.4, puff 2.3 -> 1.44, blast 3.4 -> 2.1.
  up: 28.8, cap: 9.4, burn: .62, fill: .38, from: .12, ease: .16,
  // THE HOVERBOARD (c114). The pack burns while he is RIDING, and the only thing that changes
  // is how hard: a jetpack on foot is a climb, a jetpack under a board wants to be a HOVER, or
  // the deck simply becomes a lift and the skating stops being the point.
  // `board.up` keeps the thrust ABOVE gravity -- 28.8 x .78 = 22.5 against `SK8.g` 20, a ratio
  // of 1.12 against the 1.44 he gets on foot -- so he still climbs, slowly, and `board.cap`
  // holds the top of that climb to a drift rather than a launch. Multipliers rather than their
  // own numbers, so the day `up` is retuned the hoverboard follows it instead of drifting out
  // of agreement with it.
  // `SK8.g` IS 20, THE SAME AS `MOVE.g`, so the ratio carries over with nothing re-derived --
  // which is the only reason this is two multipliers and not a second tuning pass.
  board: { up: .78, cap: .55 },
  // PUTT, PUTT, PUTT. `every` is the gap between cards, and it is what makes a jetpack read as
  // a motor rather than as a jet of gas: a continuous stream is a shader effect, a rhythm of
  // discrete puffs is drawn animation. The FIRST one is the ignition bank (a crack), every one
  // after it is `puff` -- which is the same drawings two frames in, so the crack is simply not
  // played. No word on any of them: a motor running is not a punchline.
  every: .085, puff: .92, blast: 1.5, drift: 3.4,
  // WHERE THE FLAME COMES OUT, IF THE FILE SAYS SO -- the blaster's `weapon_root` rule, whole:
  // when a rig arrives with the joint, use the joint and change nothing else.
  // `models/alien_jetpack.glb` AS SHIPPED HAS NO NULLS IN IT AT ALL. Read through the real
  // loader: ONE node, one Tripo mesh, 0 skins, 0 animations. So until an export carries them
  // the nozzle is MEASURED -- the bottom of the pack's own world bounds, the skateboard's rule
  // -- and the moment nodes appear under any of these names they are taken with no code edit.
  // THE TEST IS THAT A LOCATOR HAS NO MESH. An empty is a marker and a mesh is art, which is
  // the structural test `stripPoses` uses one file over: a mesh called `jetpack` must never be
  // mistaken for a nozzle, and the next exporter will spell the name differently anyway.
  look: 'cards',    // 'flame' | 'cards' | 'glow' | 'both' -- see `muzzleFlash`
  tip: /^(jet|nozzle|thrust|exhaust|flame)/i,
  // A FLAME IS NOT A CARD. A card is a drawing that plays once and dies; a flame is a thing
  // that is ON for as long as the motor burns. So it is the CHARGE BALL's machinery -- a stack
  // of additive sprites at one point, flickering, sized by `p.jetK` -- and not a new
  // vocabulary invented for it, which is the c101 lesson ("electric tree branches") standing.
  // The flicker is the crackle's own rule: at thirty frames a second a value thrown somewhere
  // new every frame IS what fire looks like, for the cost of writing a scale.
  // BLUE, BECAUSE IT IS A JET AND NOT A BONFIRE. The first version was orange -- a campfire
  // palette on a thruster -- and a hot gas flame is the other end of the scale: near-white at
  // the throat, cyan through the middle, deep blue at the edge where it is coolest. Narrower
  // than the orange one too: fire spreads, a jet is a column.
  // TIGHTER, AND STARTING AT THE NOZZLE (c139). *"The jet flames are not coming out of the parts
  // of the jetpack -- they're well below it and too wide."* Two reasons and both are the
  // fallback's, because the file still has no nulls in it: the measured nozzle is the bottom of
  // the pack's WORLD AABB, which on a rotated pack sits lower than the pack really does, and the
  // sprite was then CENTRED half a flame-length below that. `up` lifts the anchor back into the
  // body and the flame now hangs from it rather than around it.
  flame: { len: .42, wide: .085, flick: .30, up: .16, hue: ['#eaf8ff', '#4fd2ff', '#2a62ff'] },
  // TWO OF THEM, EVEN WITH NO JOINTS IN THE FILE. The measured fallback is ONE point -- the
  // bottom-centre of the pack -- and one flame down the middle of his back is a rocket, not a
  // jetpack. Until an export carries the nulls, the pair is placed off that centre along HIS
  // OWN right vector (`faceH`), so it stays across his back whichever way he turns, at a
  // fraction of the pack's MEASURED size rather than a typed offset.
  nozAt: .13,
  // `at` is in the SPINE BONE's own frame: across, along, and out from his back. Clear of him
  // rather than in him -- "it fits decent but could move backwards a little bit".
  // `city.JET.at[2] = -.19; city.weapFit()` nudges it live.
  size: .30, at: [0, .02, -.15], rot: [0, 0, 0],
  bone: [/spine2$/i, /spine1$/i, /upperchest/i, /chest/i, /spine$/i],
};

// THE RIGHT STICK ORBITS, IT DOES NOT PITCH. Up and down on that pad are spent the
// moment they move the lens, and they are worth more as verbs -- jump, and whatever
// comes after it. So the elevation is a constant: a shallow look-down that keeps him

      colinScale(WEAP.strafeR, clamp(sp / WEAP.strafeRRef, GAIT.tsLo, GAIT.tsHi));
    } else {

  // pose own the arms. Done HERE, after the whole board branch has had its say, so every
  // weight and every time scale it worked out is preserved -- the push clip is the CLOCK for
  // the shove (see SK8), and a leg clone that did not inherit its scale would put his foot on
  // the road on the wrong frame.
  // WHAT HIS ARMS ARE DOING WHILE HE RIDES, in order of who has the better claim: a strike is
  // happening NOW and outranks a pose being held, and the gun's own three follow.
  if (p.board && !p.hit && (p.mel || KIT.out.blaster)) {
    const up = (p.mel ? p.mel
      : p.aim ? WEAP.aimPose : p.fireT > 0 ? WEAP.clip : WEAP.idle) + '__up';

      // .42 s window would otherwise show the first third of a shot and stop

      // has to be told the same thing or the swing runs at 1x inside a .58 s beat
      else if (p.mel) colinScale(up, clipLen(p.mel, p.melDur) / Math.max(.05, p.melDur));
    }
  }
  colinSet(t, dt);

  // once they are together they stay together -- but they have to be PUT together: `skinWeights`
  // rewinds an action to zero the moment its weight comes up off the floor, and that happens
  // again every time `p.crouch` crosses .5 and swaps which push clip is playing, mid-cycle.
  // ONCE A CYCLE AND NOT EVERY FRAME: writing an action's time from a counter every frame is
  // what the old push code did and it is one more thing to get stuck, which it did.
  // It has to sit AFTER `colinSet`, because that is where the rewind happens.
  {

      const A = colin.actions;

  sun.position.copy(player.pos).addScaledVector(LIGHT.sunDir, 160); sun.target.position.copy(player.pos);
}

buildEl.addEventListener('click', () => { DBG = (DBG + 1) % DBGN.length; applyDbg(); });

// WHICH BUILD IS ON THE GLASS, and whether it is the newest one.
// Pages puts a ten-minute cache on index.html and an iOS home-screen app holds it
// harder than that, so "has it reloaded yet" is a real question that the running
// copy cannot answer about itself -- it will always report the build it IS.

// SERVER for it past the cache, so the game finds out about its own successor.

    // which a no-store header alone does not buy you on a CDN.

    if (!r.ok) return;
    const v = await r.json();

      updSeen = v.build; updEl.hidden = false; updEl.textContent = 'build ' + v.build + ' ready · tap';
    }

}

// ---------- frame ----------
const clock = new THREE.Clock();

  // so every card spawned during the frame was born a sixtieth of a second in the FUTURE --
  // `vAge < 0.0` discards, and the frame that got dropped was the first one: the spark.
  FX.t += dt;
  toonSync(); paintSync(); palSync();
  // The card runs the WHOLE scene -- traffic, clouds, his mixer, the post chain. Only the
  // player is suspended, and only because he is being posed rather than driven.
  // BEFORE `stepPlayer`, so a thumb holding a charge is not also read as a sprint.
  if (!TITLE.on) { stepAim(dt); stepJet(dt); }
  if (TITLE.on) titleFrame(dt); else stepPlayer(dt);
  stepBolts(dt);
  stepTraffic(dt);
  stepShots(dt);
  stepCops(dt);      // ALWAYS. Skipping it on the title card leaves six men in the T-pose on
                     // the street behind the logo -- a mixer that never updates is a bind pose,
                     // and `idle` already refuses to notice the player while `TITLE.on`.
  stepClouds(dt);
  WHEELS.set(player.speed, !TITLE.on && player.board && player.grounded && !player.hit, !!player.rail && SFX.on);
  if (TITLE.dive > 0) diveFrame(dt); else if (!TITLE.on) stepCam(dt);
  stepHole();
  blobStep();
  stepSlash(dt);
  stepBoxes();
  fxStep(dt);
  {
    // THE RING IS ALSO HOW HE FINDS THE CONTROL. Showing it only while charging means the pad
    // looks identical armed and unarmed, and "the blaster doesn't work at all" is what an
    // invisible control reads as. Dim the moment it is out, full while the charge builds.
    const el = document.getElementById('stkRChg');
    const out = !!KIT.out.blaster;
    const k = player.aim ? (WEAP.min + (1 - WEAP.min) * player.chg) : 0;
    if (el) { el.style.opacity = player.aim ? '1' : (out ? '.34' : '0'); el.style.setProperty('--c', (k || 1).toFixed(3)); }
  }
  stickWatch(dt);
  stepWrecks(dt);
  stepCash(dt);
  stepShip(dt);
  jamScan(dt);
  drawMap(dt);
  aimUntwist();                       // BEFORE: take last frame's edit off, or it compounds
  if (colin.mixer) colin.mixer.update(dt);

  renderPost();

  speedEl.textContent = Math.round(player.speed * 3.6);
}
frame();

// ---------- go ----------
(async () => {

    // the repo and the first on the wire, so it is the likeliest thing a spotty connection
    // drops -- and the old path let the source-city fallback's rejection out of the IIFE, which
    // painted "could not load" on the card with nothing to do about it but reload the page and
    // fetch the fifteen megabytes that DID arrive all over again.
    let city;
    for (;;) {
      try { city = await loadGLB('models/city.glb', 'loading shredworld'); break; } catch (e) { console.warn('no baked city, loading the source', e); }
      try { city = await loadGLB('LowPoly_City_01.glb', 'loading the source city'); break; } catch (e) { console.warn('no source city either', e); }
      await bootAsk('the city did not arrive');

    await new Promise(r => setTimeout(r, 30));
    let ramps = null;
    try { buildShip(await loadGLB(SHIP.url, 'parking the ship')); }
    catch (e) { console.warn('no ship', e); }
    try { ramps = await loadGLB(PARK.url, 'building the park'); }
    catch (e) { console.warn('no ramps', e); }
    try { buildBoard(await loadGLB(BOARD.url, 'shaping the board')); }
    catch (e) { console.warn('no board model, keeping the procedural one', e); }
    let copGlb = null, gunGlb = null;
    try { copGlb = await loadGLB(COP.url, 'swearing in the police'); }
    catch (e) { console.warn('[cop] no police_officer.glb', e); }
    try { gunGlb = await loadGLB(COP.gunUrl, 'issuing sidearms'); }
    catch (e) { console.warn('[cop] no pistol.glb -- they will chase you unarmed', e); }
    try { attachGear(await loadGLB(WEAP.url, 'charging the blaster'), 'blaster'); }
    catch (e) { console.warn('[kit] no blaster', e); }
    try { attachGear(await loadGLB(JET.url, 'fuelling the jetpack'), 'jet'); }
    catch (e) { console.warn('[kit] no jetpack', e); }
    // WHAT THEY WEAR, LOADED BEFORE ANY SKIN IS BUILT. A garment is kilobytes and the skins come
    // down behind the card one at a time, so getting it on the wire here means `buildSkin` can
    // hand it straight to `dressSkin` rather than dressing it as a special case later.
    // **AND IT IS STILL APPLIED LATE IF IT ARRIVES LATE** -- a slow fetch must not cost him the
    // flag for the session, which is `CHARS.failed`'s own argument one asset along.
    for (const c of CHARS.list) {
      if (!c.wear || WEARS[c.wear]) continue;
      try { WEARS[c.wear] = (await loadGLB(c.wear, 'sewing on the colours')).scene; }
      catch (e) { console.warn('[wear] no ' + c.wear, e); }
      for (const k in CHARS.skins) if (CHARS.skins[k]) CHARS.worn[k] = wearFit(CHARS.skins[k], k);
    }
    // NOT `weapFit()` HERE. Colin has not loaded yet at this point -- he is three awaits
    // further down -- so there is no hand to hang anything on. `wear` calls `gearRehome` for
    // the first skin and for every change after it, which is the one place that knows.
    buildCity(city, ramps);
    buildLadders();
    barsFrom();       // after the solids exist: a bar IS one of them
    barDraw();
    buildCash();      // after the collider: every strap's height is read off the ground
    if (copGlb) buildCops(copGlb, gunGlb);
    {
      const got = [];
      for (const u of CLOUDS.urls) { try { got.push(await loadGLB(u, 'loading the sky')); } catch (e) { /* that one is not here */ } }
      if (got.length) buildClouds(got); else console.warn('no cloud models found');
    }
    // THE BORROWED CLIPS GO INTO THE SAME POOL COLIN'S OWN ARE IN, so every skin picks them up
    // through `skinClips` unchanged -- the same filter, the same HIPFIX, no second path. They
    // are already rotation-only (see `npm run melee`), which is what makes that safe: Colin
    // takes the pool raw, and an alien's position tracks would stretch him to alien lengths.
    let melee = null;
    try { melee = await loadGLB(MELEE.url, 'learning to fight'); }
    catch (e) { console.warn('[melee] no melee.glb -- punches and the roll will be missing', e); }
    setBoot('waking colin');
    // COLIN IS THE ONE FILE NOTHING ELSE CAN STAND IN FOR, AND HIS FAILURE WAS SILENT (c140).
    // *"It took a really long time and then none of the characters were rendered. It was just
    // see-through, just nothing there."* That is this line: a `console.warn` in a `catch`, and
    // then the boot carried on, `ready` went true, the card came up and the street was empty.
    // AND IT TOOK THE WHOLE ROSTER WITH IT. `lineFill` is gated on `colin.ready` -- rightly,
    // because `skinClips` builds every other character out of HIS pool -- so one failed fetch
    // is not one missing character, it is ALL of them, and the card has nobody on it at all.
    // There is no game without him, so this is the one load that WAITS rather than warning.
    // AND IT GIVES UP EVENTUALLY (c147). c140 wrote this as `for (;;)` on the argument that there
    // is no game without him -- true, and an unbounded retry is still wrong: a failure that is
    // NOT the network (a decoder this environment cannot build, a corrupt file) makes it a hot
    // loop that never yields an answer, and the headless harnesses sat in it for ever flooding
    // the log. After `LOADT.rounds` the boot goes on and the chip says `NO COLIN GLB`, which is
    // a game you can at least look at and a report that names itself.
    for (let round = 0; round < LOADT.rounds; round++) {
      try { buildColin(await loadGLB('models/colin.glb', 'loading colin'), melee && melee.animations); break; }
      catch (e) { console.warn('colin failed', e); if (round < LOADT.rounds - 1) await bootAsk('colin did not arrive'); }
    }
    // AND THE OFFICERS BORROW HIS AIR CLIPS, here rather than in `buildCops` -- they are built
    // three awaits earlier and `colin.clips` does not exist yet when they are.
    copsLearnFlight();

    player.pos.y = sg.hit ? sg.floor : hmAt(player.pos.x, player.pos.z); player.safe.copy(player.pos);
    buildMap();
    // AFTER the collider exists, because it is what the search reads.
    try { titleAimClear(); } catch (e) { console.warn('[title] aim search failed', e); }
    ready = true;
    setBoot('drop in', 1);
    await bootHold();                  // the splash is a card, not a flicker
    document.getElementById('boot').classList.add('off');
    titleEl.classList.add('on');
    // whoever he was last time, fetched now rather than on the boot path: the card shows
    // Colin until it arrives, and the chip stays lit for the one it is waiting on.
    try { const k = localStorage.getItem(CHARS.key); if (k && k !== 'colin' && CHARS.list.some(c => c.key === k)) pickChar(k, 1, 1); } catch (e) {}
  } catch (e) { console.error(e); bootErr.textContent = 'could not load: ' + (e && e.message || e); }
})();
