<!doctype html>
<html lang="en">

<style>
  :root{--disp:'Fredoka',system-ui,sans-serif;--ink:#eaf6ff;--rim:rgba(157,247,255,.45)}
  /* touch-action:manipulation is what actually kills iOS double-tap-to-zoom. The viewport
     meta does not: Safari honours user-scalable=no for pinch and ignores it for the tap. */
  html,body{touch-action:manipulation;margin:0;height:100%;background:#0b1020;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--disp);color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* ---- boot card ---- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(circle at 50% 40%,#182a52,#0b1020 70%);z-index:20;transition:opacity .5s}
  #boot.off{opacity:0;pointer-events:none}
  #boot h1{font-weight:700;font-size:38px;letter-spacing:.18em;margin:0;text-transform:uppercase;color:#bff4ff;text-shadow:0 0 24px rgba(120,238,255,.6)}
  #boot .bar{width:220px;height:6px;border-radius:3px;background:rgba(157,247,255,.15);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee7ff,#e8fbff);transition:width .15s}
  #boot .msg{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
  #boot .err{color:#ffb4b4;font-size:13px;max-width:80vw;text-align:center;white-space:pre-wrap;opacity:.9}
  /* ---- sticks (from Plutopia) ---- */
  #sticks .stick{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;z-index:4;touch-action:none;
    background:radial-gradient(circle,rgba(157,247,255,.10),rgba(157,247,255,.03) 58%,rgba(157,247,255,0) 74%);
    border:1.5px solid rgba(157,247,255,.26);box-shadow:inset 0 0 26px rgba(120,238,255,.08);transition:border-color .18s,box-shadow .18s}
  #sticks .stick.act{border-color:rgba(157,247,255,.62);box-shadow:inset 0 0 30px rgba(120,238,255,.16),0 0 18px rgba(120,238,255,.16)}
  #sticks .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 32%,rgba(255,250,236,.72),rgba(246,232,204,.34) 58%,rgba(110,170,196,.18));
    border:1px solid rgba(246,232,204,.55);box-shadow:0 0 10px rgba(157,247,255,.22),inset 0 1px 3px rgba(255,255,255,.32);transition:transform .06s linear,box-shadow .18s}
  #sticks .stick.act .knob{box-shadow:0 0 22px rgba(157,247,255,.55),inset 0 1px 3px rgba(255,255,255,.45)}
  #sticks .lbl{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.22em;color:var(--ink);opacity:.55}
  #stkL{left:calc(20px + env(safe-area-inset-left))} #stkR{right:calc(20px + env(safe-area-inset-right))}
  /* ---- round keys ---- */
  .key{position:fixed;width:62px;height:62px;border-radius:50%;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center;
    color:var(--ink);border:1.5px solid var(--rim);font:600 10.5px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;
    background:radial-gradient(circle at 40% 32%,rgba(157,247,255,.13),rgba(10,14,40,.52) 62%,rgba(10,14,40,.62));
    box-shadow:0 4px 16px rgba(0,0,0,.45),inset 0 0 18px rgba(120,238,255,.06);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .key.on{border-color:rgba(157,247,255,.95);box-shadow:0 0 22px rgba(120,238,255,.5),inset 0 0 22px rgba(120,238,255,.2);color:#fff}
  #boardB{right:calc(166px + env(safe-area-inset-right));bottom:calc(61px + env(safe-area-inset-bottom))}
  #resetB{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;font-size:16px}
  /* ---- chips ---- */
  .chip{position:fixed;z-index:4;font:600 11px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:.7;
    padding:7px 10px;border-radius:999px;border:1px solid rgba(157,247,255,.22);background:rgba(10,14,40,.45);backdrop-filter:blur(6px)}
  #build{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));opacity:1;padding:6px 12px}
  #build b{font-size:18px;font-weight:700;letter-spacing:.04em;color:#8ef0ff;text-shadow:0 0 12px rgba(120,238,255,.75)}
  #build i{font-style:normal;font-size:10px;opacity:.55;margin-left:8px;letter-spacing:.1em}
  /* Three slow pulses on load. The question this answers is "did it actually reload",
     and a number that looks identical whether it changed or not cannot answer it. */
  #build.fresh{animation:fresh 1.5s ease-out 3}
  @keyframes fresh{0%,100%{border-color:rgba(157,247,255,.22);box-shadow:none}
    45%{border-color:rgba(157,247,255,.95);box-shadow:0 0 26px rgba(120,238,255,.8),inset 0 0 18px rgba(120,238,255,.3)}}
  /* The newer build is on the server and this one is not it. */
  #upd{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;z-index:6;border:0;cursor:pointer;
    font:700 12px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:#04141c;padding:12px 17px;border-radius:999px;
    background:linear-gradient(180deg,#a6f4ff,#49cdec);box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 26px rgba(120,238,255,.55);
    animation:updp 1.5s ease-in-out infinite}
  @keyframes updp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  #speed{top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;min-width:70px;text-align:center}
  #speed b{font-size:20px;letter-spacing:0;margin-right:4px}
  #help{bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);opacity:.45;text-align:center;letter-spacing:.1em;text-transform:none;font-size:11px}
  @media (pointer:coarse){#help{display:none}}
</style>
</head>
<body>
<div id="boot"><h1>City</h1><div class="bar"><i id="bootBar"></i></div><div class="msg" id="bootMsg">loading the city</div><div class="err" id="bootErr"></div></div>
<div id="sticks">
  <div class="stick" id="stkL"><div class="knob"></div><div class="lbl">MOVE</div></div>
  <div class="stick" id="stkR"><div class="knob"></div><div class="lbl">LOOK</div></div>
</div>
<div class="key" id="boardB">Board</div>
<div class="key" id="resetB">&#8635;</div>
<div class="chip" id="build"><b id="buildN">c16</b><i id="perf">···</i></div>
<button id="upd" hidden></button>
<div class="chip" id="speed"><b>0</b>km/h</div>
<div class="chip" id="help">WASD move · drag to orbit · space jump · B board · R reset</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';

const BUILD = 'c16';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1400);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
// frame-rate independent smoothing: how far toward the target in one half-life
const damp = (cur, tgt, half, dt) => lerp(cur, tgt, 1 - Math.pow(0.5, dt / half));
const wrapAngle = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
const smooth = (a, b, x) => { const t = clamp((x - a) / ((b - a) || 1e-6), 0, 1); return t * t * (3 - 2 * t); };

// ---------- tuning ----------
// LOCOMOTION, ported from Plutopia, where this has actually been through the mill.
// Three separate ideas, and the moonwalk comes from missing the third.
//
// 1. THE GATHER IS IN HIS LEGS, NOT IN THE TARGET. `push` is how much of his
//    acceleration he currently HAS: it starts at push0 and reaches all of it over pushT
//    seconds of continuously asking, and falls back at pushOut rather than resetting, so
//    a step, a pause and another step is not three standing starts. On top of it accFall
//    thins the acceleration out again as he nears top speed, so the first units come
//    quickly and the last take their time. He genuinely walks, then jogs, then runs.
//
// 2. FACING IS NOT HEADING. `heading` is the thumb's direction, taken instantly.
//    `faceH` is where his body actually points, and it comes round more slowly the
//    faster he is going: quick on the spot, an arc at a run, because a running man arcs.
//
// 3. AND THE LEGS PUSH WHERE HIS FEET ARE PLANTED. Below plantAt the push goes where the
//    thumb says, so a standing start goes where you point. Above plantFull it goes along
//    HIS OWN FACING, so facing and travel cannot come apart and the only way to change
//    direction at a run is to turn through it. This is the part I had missing, and its
//    absence is exactly the moonwalk: without it the velocity keeps answering to the
//    stick while the body has already swung round, so he faces one way and travels
//    another. A hard turn also costs him speed, which is what plants the feet rather
//    than merely pointing them.
//
// Steering is split from acceleration as well: `turn` caps how fast the velocity can be
// pushed SIDEWAYS, separately from how fast it can be lengthened.
const MOVE = {
  max: 9, acc: 24, accFall: .93, drag: 46,
  push0: .30, pushT: .85, pushOut: 2.6,
  airAcc: 11, airDrag: 1.2,
  turn: 26, airTurn: 9,
  face0: 11, face1: 5.2,
  plantAt: 2.2, plantFull: 6.5,
  turnBrake: .42,
  // Exaggerated on purpose: ~2.8 m of apex and a full second of air, so there is room for
  // the going-up and coming-down clips to actually read as two different things.
  jump: 10.6, g: 20, dead: .12, curve: 1.4, step: .55, coyote: .12,
};
// GAIT. Three clips at once, weighted by how fast he is ACTUALLY travelling, so the
// blend is a consequence of the speed rather than a second decision about it. Each
// clip's clock is tied to the ground speed as well, so the feet do not skate.
const GAIT = { walkAt: 1.5, runAt: 6.0, walkRef: 1.55, runRef: 4.8, tsLo: .7, tsHi: 1.7 };
const SK8 = {
  pushV: 2.7,        // m/s added per push
  pushPeriod: .52,   // seconds between pushes while the stick is held forward
  pushMax: 10.5,     // pushing stops adding above this; hills can
  brake: 9,          // m/s^2 with the stick pulled back
  drag: .09,         // rolling resistance, per second
  air: .0025,        // quadratic air drag
  grip: 7,           // how fast sideways velocity dies (carve vs slide)
  turnLo: 3.2, turnHi: 1.25,   // yaw rate at a crawl / at speed (rad/s)
  ollie: 9.9, g: 20,          // a hefty ollie: ~2.4 m, comparable hang time
  spin: 4.2,         // air yaw rate with the stick
  lean: .5,          // visual roll per unit steer
  step: .42,         // curb height the wheels roll up
  bailAng: 1.15,     // landing more sideways than this scrubs the speed
  pivot: 1.6,        // yaw rate standing still on the board
};
// THE RIGHT STICK ORBITS, IT DOES NOT PITCH. Up and down on that pad are spent the
// moment they move the lens, and they are worth more as verbs -- jump, and whatever
// comes after it. So the elevation is a constant: a shallow look-down that keeps him
// and the street he is on both in frame, and the pad's whole travel means yaw.
const CAM = { dist: 6.4, distV: .11, el: .17, look: 1.3, yawRate: 2.4, follow: 1.8, idle: .55, half: .07, fov: 52, fovRush: 9 };
const TOON = { k: 1, bands: 2, soft: .055, floor: .34, rim: .26, rim0: .26, rimP: 3.4, rimCol: new THREE.Color('#dcefff'),
  spec: 1, specG: .06 };   // how much specular survives overall, and at the GRAZING end
// His materials: matte, and lifted out of the dark by feeding the base map back in as a
// low emission, which is how he is authored in Blender. Emission lands after the toon
// ramp and after shadows, so it is illumination without shine.
const COLINM = { rough: .95, metal: 0, emis: .30 };
const LIGHT = { sun: 3.4, hemi: 1.6, fill: .9, sunDir: new THREE.Vector3(.55, 1, .35).normalize() };
// BLOOM IS OFF. Not because it is proven guilty -- the rig, the normals, the weights and
// the materials have all been read and are all clean, and c5 fixed a real aliasing fault
// in the bright pass -- but because it has been blamed three times and never ruled out.
// At 0 the pale specks either go with it or they do not, and either answer is worth more
// than another guess. Put it back to .85 once we know.
const POST = { bloom: .85, bloom0: .85, bloomTh: 1.45, bloomKnee: .6, outline: .55, outline0: .55, outlineW: 1, vig: .45, exposure: 1.05 };
const Q = { dpr: Math.min(devicePixelRatio || 1, 2) * (MOBILE ? .8 : 1), present: Math.min(devicePixelRatio || 1, 2), bloomDiv: 3 };
Q.dpr0 = Q.dpr;   // the world is drawn at this and upscaled to `present`; /5 turns the gap off
const CAR_FWD = 1;        // +1: the car mesh's local +Y is its nose. Flip to -1 if they drive backwards.
const COLIN_HEIGHT = 1.75;
const HEAD_SHAPE = 'Colin_Head_MIX';   // the target that turns the base head into his
const SPAWN = { x: -100.8, y: 0, z: 0, heading: 0 };

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Q.present);
renderer.setSize(innerWidth, innerHeight, false);
renderer.domElement.style.width = ''; renderer.domElement.style.height = '';
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = MOBILE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;          // ACES + gamma happen in the composite
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); setTimeout(() => location.reload(), 800); });

const scene = new THREE.Scene();
const FOGC = new THREE.Color(0xb9d3ea);
scene.fog = new THREE.FogExp2(FOGC, .0021);
renderer.setClearColor(FOGC, 1);
const camera = new THREE.PerspectiveCamera(CAM.fov, innerWidth / innerHeight, .3, 1600);

// ---------- lights ----------
const sun = new THREE.DirectionalLight(0xfff1dc, LIGHT.sun); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// 96 m across 2048 texels is 4.7 cm -- about 37 texels up a person, which is the least
// that reads as a shadow rather than as a handful of squares. The cost of the smaller box
// is that a building further than 48 m stops casting; the crispness is worth it.
// Plutopia wraps near/far tightly round the receivers and calls that "most of the cure
// for the striping on flat ground". Mine spent 410 units of depth range on a scene about
// a hundred deep, which is precision thrown away for nothing.
const SHADOW = { span: 48, dist: 160 };
const sc = sun.shadow.camera;
sc.left = sc.bottom = -SHADOW.span; sc.right = sc.top = SHADOW.span;
sc.near = SHADOW.dist - SHADOW.span * 1.6; sc.far = SHADOW.dist + SHADOW.span * 2.2;
// normalBias is in WORLD UNITS along the surface normal. At .5 it moved the lookup half a
// metre -- a third of the way through the body it was meant to bias by one texel.
// And the normal offset is counted in TEXELS, not in metres -- it is the box divided by
// the map, so it cannot be a constant. Plutopia uses two and a half.
sun.shadow.bias = -.0004;
sun.shadow.normalBias = SHADOW.span * 2 / 2048 * 2.5;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0x9bc5ee, 0x4b5a48, LIGHT.hemi); scene.add(hemi);
const fill = new THREE.DirectionalLight(0x9fd4e8, LIGHT.fill); fill.position.set(-1, .4, -.6); scene.add(fill);

// ---------- the toon ramp (Plutopia's, on r180 chunk names) ----------
const TOON_UNI = { uToonK: { value: 1 }, uToonN: { value: 2 }, uToonSoft: { value: .055 }, uToonFloor: { value: .34 }, uRim: { value: .26 }, uRimP: { value: 3.4 }, uRimCol: { value: TOON.rimCol }, uSpec: { value: 1 }, uSpecG: { value: .06 } };
function toonSync() {
  TOON_UNI.uToonK.value = TOON.k; TOON_UNI.uToonN.value = Math.max(1, TOON.bands); TOON_UNI.uToonSoft.value = Math.max(.001, TOON.soft);
  TOON_UNI.uToonFloor.value = TOON.floor; TOON_UNI.uRim.value = TOON.rim; TOON_UNI.uRimP.value = TOON.rimP;
  TOON_UNI.uSpec.value = TOON.spec; TOON_UNI.uSpecG.value = TOON.specG;
}
function toonPatch(sh) {
  for (const k in TOON_UNI) sh.uniforms[k] = TOON_UNI[k];
  // A SKINNED NORMAL CAN COME OUT AS ZERO, AND THAT IS THE WHITE BALLS.
  // At a joint, a vertex is weighted between two bones. When those bones rotate against
  // each other the two rotated copies of its normal point opposite ways and the weighted
  // sum cancels to nothing. three applies the skin matrix to the normal and does NOT
  // renormalise before this line, so normalize() gets a zero vector and returns NaN --
  // and a NaN at ONE vertex is interpolated across the WHOLE triangle. Every fragment of
  // it shades to NaN, which reads as white, sails over the bloom threshold and comes back
  // as a soft ball. It sits on a joint because that is the only place normals can cancel,
  // it needs a lit material because an unlit one never touches the normal, and it needs
  // the bloom to become a ball rather than a speck. That is every symptom.
  sh.vertexShader = sh.vertexShader.replace('#include <normal_vertex>', `#ifndef FLAT_SHADED
    vNormal = dot( transformedNormal, transformedNormal ) > 1e-10 ? normalize( transformedNormal ) : vec3( 0.0, 0.0, 1.0 );
    #ifdef USE_TANGENT
      vTangent = normalize( transformedTangent );
      vBitangent = normalize( cross( vNormal, vTangent ) * tangent.w );
    #endif
  #endif`);
  sh.fragmentShader = 'uniform float uToonK, uToonN, uToonSoft, uToonFloor, uRim, uRimP, uSpec, uSpecG;\nuniform vec3 uRimCol;\n'
    + 'float toonRamp(float x){\n  float s = x * uToonN, b = floor(s), f = s - b;\n'
    + '  float q = (b + smoothstep(0.5 - uToonSoft, 0.5 + uToonSoft, f)) / uToonN;\n'
    + '  q = uToonFloor + (1.0 - uToonFloor) * q;\n  return mix(x, q, uToonK);\n}\n'
    + sh.fragmentShader
      // THE RED CONTOUR, AND IT IS THE TOON RAMP FEEDING THE SPECULAR.
      //
      // three's Smith visibility term ends with  0.5 / max( gv + gl, EPSILON )  where both
      // gv and gl carry a factor of dotNV or dotNL. On a silhouette BOTH go to zero, the
      // denominator collapses onto EPSILON, and V comes back around half a million. That is
      // fine in stock three, because the same dotNL multiplies the irradiance in front of
      // it and cancels the blow-up exactly.
      //
      // The ramp broke that cancellation. It was substituted into the ONE dotNL that feeds
      // BOTH lobes, and it has a floor of .34 -- so where the true dotNL was zero the
      // irradiance was still a third of full sun while the visibility term had already
      // exploded. A third of 3.4 times half a million is the red one-pixel contour tracing
      // his outline, which the bloom then hands back as a ball.
      //
      // So the ramp now shapes the DIFFUSE only, which is all it was ever meant to shape.
      // The specular keeps the true geometric dotNL and cancels itself as designed.
      // It is Colin and not the city because a dense curved mesh is nearly all silhouette
      // at the edges, where a flat-shaded low-poly block has almost no grazing pixels.
      .replace('#include <lights_physical_pars_fragment>', THREE.ShaderChunk.lights_physical_pars_fragment
        .replace('float dotNL = saturate( dot( geometryNormal, directLight.direction ) );\n\tvec3 irradiance = dotNL * directLight.color;',
          'float dotNL = saturate( dot( geometryNormal, directLight.direction ) );\n\tvec3 irradiance = dotNL * directLight.color;\n\tvec3 irradianceToon = toonRamp( dotNL ) * directLight.color;')
        .replace('reflectedLight.directDiffuse += irradiance * BRDF_Lambert( material.diffuseColor );',
          'reflectedLight.directDiffuse += irradianceToon * BRDF_Lambert( material.diffuseColor );'))
      // and the same guard after interpolation, since a NaN varying stays NaN
      .replace('#include <normal_fragment_begin>', '#include <normal_fragment_begin>\n  if ( !( dot( normal, normal ) > 0.5 ) ) normal = vec3( 0.0, 0.0, 1.0 );')
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
      {
        float _nv = saturate( dot( geometryNormal, geometryViewDir ) );
        // THE WHITE SPECKS, AND WHY ROUGHNESS COULD NEVER FIX THEM. Schlick's Fresnel
        // takes every dielectric to a mirror at grazing incidence: F goes to 1.0 however
        // rough the surface is, so a 0.95-rough jacket still hands back the full 3.4 of
        // the sun along its own silhouette. That is not a highlight, it is the EDGE of
        // the model -- which is why the specks traced his outline, and why nothing done
        // to roughness, metalness or the maps ever moved them. The bloom was only the
        // amplifier: each sub-pixel mirror sits far above the threshold and comes back
        // as a soft white ball. Held down at the grazing end, left alone head-on, which
        // is where a highlight actually belongs.
        float _sk = uSpec * mix( uSpecG, 1.0, _nv );
        reflectedLight.directSpecular *= _sk;
        reflectedLight.indirectSpecular *= _sk;
        // and a hard ceiling, because no highlight in this game is worth eight times the
        // sun and a grazing-angle singularity should never reach the frame again
        reflectedLight.directSpecular = min( reflectedLight.directSpecular, vec3( 4.0 ) );
        reflectedLight.indirectSpecular = min( reflectedLight.indirectSpecular, vec3( 4.0 ) );
        float _rf = 1.0 - _nv;
        totalEmissiveRadiance += uRimCol * (pow(_rf, uRimP) * uRim * uToonK);
      }`);
}
THREE.MeshStandardMaterial.prototype.onBeforeCompile = function (sh) { toonPatch(sh); };
THREE.MeshStandardMaterial.prototype.customProgramCacheKey = function () { return 'toon' + (this.userData.tag || ''); };

// ---------- sky ----------

  const wx = cam.tgt.x - Math.sin(cam.az) * ce * dist, wy = cam.tgt.y + Math.sin(cam.el) * dist, wz = cam.tgt.z - Math.cos(cam.az) * ce * dist;

  cam.pos.x = damp(cam.pos.x, wx, CAM.half, dt); cam.pos.y = damp(cam.pos.y, wy, CAM.half, dt); cam.pos.z = damp(cam.pos.z, wz, CAM.half, dt);
  const floor = hmAt(cam.pos.x, cam.pos.z) + .6; if (cam.pos.y < floor) cam.pos.y = floor;
  camera.position.copy(cam.pos); camera.lookAt(cam.tgt);
  cam.rush = damp(cam.rush, clamp((sp - 8) / 12, 0, 1), .25, dt);
  camera.fov = CAM.fov + cam.rush * CAM.fovRush; camera.updateProjectionMatrix();
  compMat.uniforms.uRush.value = cam.rush * .6;
  sky.position.copy(camera.position);
  // the sun's shadow box rides with him
  sun.position.copy(player.pos).addScaledVector(LIGHT.sunDir, 160); sun.target.position.copy(player.pos);
}

// ---------- HUD ----------
const speedEl = document.getElementById('speed').querySelector('b');
const buildEl = document.getElementById('build'), buildNEl = document.getElementById('buildN'), perfEl = document.getElementById('perf');
let fpsT = 0, fpsN = 0, fps = 0;
buildNEl.textContent = BUILD; buildEl.classList.add('fresh');
buildEl.style.cursor = 'pointer';
buildEl.addEventListener('click', () => { DBG = (DBG + 1) % 10; applyDbg(); });

// WHICH BUILD IS ON THE GLASS, and whether it is the newest one.
// Pages puts a ten-minute cache on index.html and an iOS home-screen app holds it
// harder than that, so "has it reloaded yet" is a real question that the running
// copy cannot answer about itself -- it will always report the build it IS.
// version.json is rewritten by tools/bump.mjs on every push, and this asks the
// SERVER for it past the cache, so the game finds out about its own successor.
const updEl = document.getElementById('upd');
let updSeen = null;
async function checkUpdate() {
  try {
    // The query string is the point: a distinct URL is a cache miss at every hop,
    // which a no-store header alone does not buy you on a CDN.
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = await r.json();
    if (v.build && v.build !== BUILD && v.build !== updSeen) {
      updSeen = v.build; updEl.hidden = false; updEl.textContent = 'build ' + v.build + ' ready · tap';
    }
  } catch (e) { /* offline, or no version.json yet: nothing worth saying */ }
}
updEl.addEventListener('click', () => location.replace(location.pathname + '?v=' + Date.now()));
setInterval(checkUpdate, 15000);
addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
checkUpdate();

// ---------- frame ----------
const clock = new THREE.Clock();
let ready = false;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  if (!ready) return;
  toonSync();
  stepPlayer(dt);
  stepTraffic(dt);
  stepCam(dt);
  if (colin.mixer) colin.mixer.update(dt);
  renderPost();
  fpsN++; fpsT += dt; if (fpsT > .5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; perfEl.textContent = fps + ' fps · ' + renderer.info.render.calls + ' dc' + dbgInfo; }
  speedEl.textContent = Math.round(player.speed * 3.6);
}
frame();

// ---------- go ----------
(async () => {
  try {
    let city;
    try { city = await loadGLB('models/city.glb', 'loading the city'); }
    catch (e) { console.warn('no baked city, loading the source', e); city = await loadGLB('LowPoly_City_01.glb', 'loading the source city'); }
    setBoot('building the streets', 1);
    await new Promise(r => setTimeout(r, 30));
    buildCity(city);
    setBoot('waking colin', 1);
    try { const c = await loadGLB('models/colin.glb', 'loading colin'); buildColin(c); } catch (e) { console.warn('colin failed', e); }
    player.pos.y = hmAt(player.pos.x, player.pos.z); player.safe.copy(player.pos);
    ready = true;
    document.getElementById('boot').classList.add('off');
  } catch (e) { console.error(e); bootErr.textContent = 'could not load: ' + (e && e.message || e); }
})();
window.city = { TOON, COLINM, SK8, MOVE, GAIT, CAM, POST, LIGHT, SHADOW, player, cam, cars, tiles, solids, hmAt, renderer, scene, camera, compMat, cityGroup, colin };
</script>
</body>
</html>
