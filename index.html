<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>City</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="City">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--disp:'Fredoka',system-ui,sans-serif;--ink:#eaf6ff;--rim:rgba(157,247,255,.45)}
  html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--disp);color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* ---- boot card ---- */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(circle at 50% 40%,#182a52,#0b1020 70%);z-index:20;transition:opacity .5s}
  #boot.off{opacity:0;pointer-events:none}
  #boot h1{font-weight:700;font-size:38px;letter-spacing:.18em;margin:0;text-transform:uppercase;color:#bff4ff;text-shadow:0 0 24px rgba(120,238,255,.6)}
  #boot .bar{width:220px;height:6px;border-radius:3px;background:rgba(157,247,255,.15);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ee7ff,#e8fbff);transition:width .15s}
  #boot .msg{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
  #boot .err{color:#ffb4b4;font-size:13px;max-width:80vw;text-align:center;white-space:pre-wrap;opacity:.9}
  /* ---- sticks (from Plutopia) ---- */
  #sticks .stick{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;z-index:4;touch-action:none;
    background:radial-gradient(circle,rgba(157,247,255,.10),rgba(157,247,255,.03) 58%,rgba(157,247,255,0) 74%);
    border:1.5px solid rgba(157,247,255,.26);box-shadow:inset 0 0 26px rgba(120,238,255,.08);transition:border-color .18s,box-shadow .18s}
  #sticks .stick.act{border-color:rgba(157,247,255,.62);box-shadow:inset 0 0 30px rgba(120,238,255,.16),0 0 18px rgba(120,238,255,.16)}
  #sticks .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 32%,rgba(255,250,236,.72),rgba(246,232,204,.34) 58%,rgba(110,170,196,.18));
    border:1px solid rgba(246,232,204,.55);box-shadow:0 0 10px rgba(157,247,255,.22),inset 0 1px 3px rgba(255,255,255,.32);transition:transform .06s linear,box-shadow .18s}
  #sticks .stick.act .knob{box-shadow:0 0 22px rgba(157,247,255,.55),inset 0 1px 3px rgba(255,255,255,.45)}
  #sticks .lbl{position:absolute;left:0;right:0;bottom:-21px;text-align:center;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.22em;color:var(--ink);opacity:.55}
  #stkL{left:calc(20px + env(safe-area-inset-left))} #stkR{right:calc(20px + env(safe-area-inset-right))}
  /* ---- round keys ---- */
  .key{position:fixed;width:62px;height:62px;border-radius:50%;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center;
    color:var(--ink);border:1.5px solid var(--rim);font:600 10.5px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;
    background:radial-gradient(circle at 40% 32%,rgba(157,247,255,.13),rgba(10,14,40,.52) 62%,rgba(10,14,40,.62));
    box-shadow:0 4px 16px rgba(0,0,0,.45),inset 0 0 18px rgba(120,238,255,.06);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .key.on{border-color:rgba(157,247,255,.95);box-shadow:0 0 22px rgba(120,238,255,.5),inset 0 0 22px rgba(120,238,255,.2);color:#fff}
  #boardB{right:calc(166px + env(safe-area-inset-right));bottom:calc(61px + env(safe-area-inset-bottom))}
  #resetB{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;font-size:16px}
  /* ---- chips ---- */
  .chip{position:fixed;z-index:4;font:600 11px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:.7;
    padding:7px 10px;border-radius:999px;border:1px solid rgba(157,247,255,.22);background:rgba(10,14,40,.45);backdrop-filter:blur(6px)}
  #build{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left))}
  #speed{top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;min-width:70px;text-align:center}
  #speed b{font-size:20px;letter-spacing:0;margin-right:4px}
  #help{bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);opacity:.45;text-align:center;letter-spacing:.1em;text-transform:none;font-size:11px}
  @media (pointer:coarse){#help{display:none}}
</style>
</head>
<body>
<div id="boot"><h1>City</h1><div class="bar"><i id="bootBar"></i></div><div class="msg" id="bootMsg">loading the city</div><div class="err" id="bootErr"></div></div>
<div id="sticks">
  <div class="stick" id="stkL"><div class="knob"></div><div class="lbl">MOVE</div></div>
  <div class="stick" id="stkR"><div class="knob"></div><div class="lbl">LOOK</div></div>
</div>
<div class="key" id="boardB">Board</div>
<div class="key" id="resetB">&#8635;</div>
<div class="chip" id="build">c1</div>
<div class="chip" id="speed"><b>0</b>km/h</div>
<div class="chip" id="help">WASD move · mouse drag look · space jump · shift run · B board · R reset</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';

const BUILD = 'c1';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1400);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
// frame-rate independent smoothing: how far toward the target in one half-life
const damp = (cur, tgt, half, dt) => lerp(cur, tgt, 1 - Math.pow(0.5, dt / half));
const wrapAngle = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };

// ---------- tuning ----------
const MOVE = { walk: 3.4, run: 7.2, accel: 26, decel: 30, jump: 7.6, g: 22, dead: .12, curve: 1.4, step: .55, coyote: .12 };
const SK8 = {
  pushV: 2.7,        // m/s added per push
  pushPeriod: .52,   // seconds between pushes while the stick is held forward
  pushMax: 10.5,     // pushing stops adding above this; hills can
  brake: 9,          // m/s^2 with the stick pulled back
  drag: .09,         // rolling resistance, per second
  air: .0025,        // quadratic air drag
  grip: 7,           // how fast sideways velocity dies (carve vs slide)
  turnLo: 3.2, turnHi: 1.25,   // yaw rate at a crawl / at speed (rad/s)
  ollie: 7.4, g: 22,
  spin: 4.2,         // air yaw rate with the stick
  lean: .5,          // visual roll per unit steer
  step: .42,         // curb height the wheels roll up
  bailAng: 1.15,     // landing more sideways than this scrubs the speed
  pivot: 1.6,        // yaw rate standing still on the board
};
const CAM = { dist: 6.4, distV: .11, el: .30, elMin: -.2, elMax: 1.15, look: 1.35, yawRate: 2.4, elRate: 1.5, follow: 1.8, idle: .55, half: .07, fov: 52, fovRush: 9 };
const TOON = { k: 1, bands: 2, soft: .055, floor: .34, rim: .26, rimP: 3.4, rimCol: new THREE.Color('#dcefff') };
const LIGHT = { sun: 3.4, hemi: 1.6, fill: .9, sunDir: new THREE.Vector3(.55, 1, .35).normalize() };
const POST = { bloom: .7, bloomTh: .78, outline: .55, outlineW: 1, vig: .45, exposure: 1.05 };
const Q = { dpr: Math.min(devicePixelRatio || 1, 2) * (MOBILE ? .8 : 1), present: Math.min(devicePixelRatio || 1, 2), bloomDiv: MOBILE ? 4 : 3 };
const CAR_FWD = 1;        // +1: the car mesh's local +Y is its nose. Flip to -1 if they drive backwards.
const COLIN_HEIGHT = 1.75;
const SPAWN = { x: -100.8, y: 0, z: 0, heading: 0 };

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Q.present);
renderer.setSize(innerWidth, innerHeight, false);
renderer.domElement.style.width = ''; renderer.domElement.style.height = '';
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = MOBILE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;          // ACES + gamma happen in the composite
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); setTimeout(() => location.reload(), 800); });

const scene = new THREE.Scene();
const FOGC = new THREE.Color(0xb9d3ea);
scene.fog = new THREE.FogExp2(FOGC, .0021);
renderer.setClearColor(FOGC, 1);
const camera = new THREE.PerspectiveCamera(CAM.fov, innerWidth / innerHeight, .3, 1600);

// ---------- lights ----------
const sun = new THREE.DirectionalLight(0xfff1dc, LIGHT.sun); sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
const sc = sun.shadow.camera; sc.left = sc.bottom = -70; sc.right = sc.top = 70; sc.near = 10; sc.far = 420;
sun.shadow.bias = -.0005; sun.shadow.normalBias = .5;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0x9bc5ee, 0x4b5a48, LIGHT.hemi); scene.add(hemi);
const fill = new THREE.DirectionalLight(0x9fd4e8, LIGHT.fill); fill.position.set(-1, .4, -.6); scene.add(fill);

// ---------- the toon ramp (Plutopia's, on r180 chunk names) ----------
const TOON_UNI = { uToonK: { value: 1 }, uToonN: { value: 2 }, uToonSoft: { value: .055 }, uToonFloor: { value: .34 }, uRim: { value: .26 }, uRimP: { value: 3.4 }, uRimCol: { value: TOON.rimCol } };
function toonSync() {
  TOON_UNI.uToonK.value = TOON.k; TOON_UNI.uToonN.value = Math.max(1, TOON.bands); TOON_UNI.uToonSoft.value = Math.max(.001, TOON.soft);
  TOON_UNI.uToonFloor.value = TOON.floor; TOON_UNI.uRim.value = TOON.rim; TOON_UNI.uRimP.value = TOON.rimP;
}
function toonPatch(sh) {
  for (const k in TOON_UNI) sh.uniforms[k] = TOON_UNI[k];
  sh.fragmentShader = 'uniform float uToonK, uToonN, uToonSoft, uToonFloor, uRim, uRimP;\nuniform vec3 uRimCol;\n'
    + 'float toonRamp(float x){\n  float s = x * uToonN, b = floor(s), f = s - b;\n'
    + '  float q = (b + smoothstep(0.5 - uToonSoft, 0.5 + uToonSoft, f)) / uToonN;\n'
    + '  q = uToonFloor + (1.0 - uToonFloor) * q;\n  return mix(x, q, uToonK);\n}\n'
    + sh.fragmentShader
      .replace('#include <lights_physical_pars_fragment>', THREE.ShaderChunk.lights_physical_pars_fragment.replace(
        'float dotNL = saturate( dot( geometryNormal, directLight.direction ) );',
        'float dotNL = toonRamp( saturate( dot( geometryNormal, directLight.direction ) ) );'))
      .replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\n{ float _rf = 1.0 - saturate( dot( geometryNormal, geometryViewDir ) ); totalEmissiveRadiance += uRimCol * (pow(_rf, uRimP) * uRim * uToonK); }');
}
THREE.MeshStandardMaterial.prototype.onBeforeCompile = function (sh) { toonPatch(sh); };
THREE.MeshStandardMaterial.prototype.customProgramCacheKey = function () { return 'toon' + (this.userData.tag || ''); };

// ---------- sky ----------
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uZen: { value: new THREE.Color(.16, .40, .86) }, uHor: { value: new THREE.Color(.60, .76, .92) }, uGnd: { value: new THREE.Color(.30, .37, .44) }, uSun: { value: LIGHT.sunDir }, uSunC: { value: new THREE.Color(1.6, 1.35, 1.0) } },
  vertexShader: 'varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.)).xyz - cameraPosition; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform vec3 uZen,uHor,uGnd,uSun,uSunC; varying vec3 vW;
    void main(){ vec3 d = normalize(vW); float t = d.y;
      vec3 c = mix(uHor, uZen, pow(max(t,0.), .5));
      c = mix(uGnd, c, smoothstep(-.10, .015, t));
      float s = max(dot(d,uSun),0.); c += uSunC * (pow(s,300.)*2.2 + pow(s,10.)*.10);
      gl_FragColor = vec4(c,1.); }`,
  depthWrite: false, depthTest: false, side: THREE.BackSide, fog: false });
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 24, 12), skyMat); sky.frustumCulled = false; sky.renderOrder = -100; scene.add(sky);

// ---------- post: scene -> bright -> blur -> composite (FXAA, depth outline, bloom, ACES, grade) ----------
function makeRT(w, h, depth) {
  const rt = new THREE.WebGLRenderTarget(Math.max(1, w | 0), Math.max(1, h | 0), { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: !!depth, stencilBuffer: false, colorSpace: THREE.LinearSRGBColorSpace });
  if (depth) { rt.depthTexture = new THREE.DepthTexture(rt.width, rt.height, THREE.UnsignedIntType); rt.depthTexture.format = THREE.DepthFormat; rt.depthTexture.minFilter = rt.depthTexture.magFilter = THREE.NearestFilter; }
  return rt;
}
let rtScene = makeRT(innerWidth * Q.dpr, innerHeight * Q.dpr, true);
let rtA = makeRT(innerWidth * Q.dpr / Q.bloomDiv, innerHeight * Q.dpr / Q.bloomDiv);
let rtB = makeRT(innerWidth * Q.dpr / Q.bloomDiv, innerHeight * Q.dpr / Q.bloomDiv);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null); quad.frustumCulled = false; quadScene.add(quad);
const VS = 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }';
const brightMat = new THREE.ShaderMaterial({ uniforms: { tD: { value: null }, uTh: { value: POST.bloomTh }, uKnee: { value: .24 } }, vertexShader: VS, fragmentShader: `
  uniform sampler2D tD; uniform float uTh,uKnee; varying vec2 vUv;
  void main(){ vec3 c=texture2D(tD,vUv).rgb; float l=dot(c,vec3(0.2126,0.7152,0.0722));
    float s=smoothstep(uTh-uKnee,uTh+uKnee,l); gl_FragColor=vec4(c*s,1.0); }` });
const blurMat = new THREE.ShaderMaterial({ uniforms: { tD: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uRes: { value: new THREE.Vector2(1, 1) } }, vertexShader: VS, fragmentShader: `
  uniform sampler2D tD; uniform vec2 uDir,uRes; varying vec2 vUv;
  void main(){ vec2 t=uDir/uRes; vec3 c=vec3(0.0);
    c += texture2D(tD,vUv).rgb*0.2270;
    c += (texture2D(tD,vUv+t*1.3846).rgb+texture2D(tD,vUv-t*1.3846).rgb)*0.3162;
    c += (texture2D(tD,vUv+t*3.2308).rgb+texture2D(tD,vUv-t*3.2308).rgb)*0.0702;
    gl_FragColor=vec4(c,1.0); }` });
const compMat = new THREE.ShaderMaterial({ uniforms: {
    tD: { value: null }, tB: { value: null }, tZ: { value: null }, uStr: { value: POST.bloom }, uVig: { value: POST.vig }, uExp: { value: POST.exposure },
    uPx: { value: new THREE.Vector2(1 / 1280, 1 / 720) }, uAA: { value: 1 }, uRush: { value: 0 },
    uOut: { value: POST.outline }, uOutW: { value: POST.outlineW }, uNear: { value: .3 }, uFar: { value: 1600 },
    uOutC: { value: new THREE.Color(.30, .34, .46) }, uOutLo: { value: .0045 }, uOutHi: { value: .034 },
  }, vertexShader: VS, fragmentShader: `
  uniform sampler2D tD,tB,tZ; uniform float uStr,uVig,uExp,uAA,uRush,uOut,uOutW,uNear,uFar,uOutLo,uOutHi;
  uniform vec3 uOutC; uniform vec2 uPx; varying vec2 vUv;
  float lz(vec2 uv){ float d = texture2D(tZ,uv).x; return (2.0*uNear*uFar)/(uFar+uNear-(2.0*d-1.0)*(uFar-uNear)); }
  vec3 aa(vec2 uv){
    vec3 L = vec3(0.299,0.587,0.114);
    vec3 m  = texture2D(tD,uv).rgb;
    vec3 nw = texture2D(tD,uv+vec2(-1.0,-1.0)*uPx).rgb, ne = texture2D(tD,uv+vec2( 1.0,-1.0)*uPx).rgb;
    vec3 sw = texture2D(tD,uv+vec2(-1.0, 1.0)*uPx).rgb, se = texture2D(tD,uv+vec2( 1.0, 1.0)*uPx).rgb;
    float lm=dot(m,L), lnw=dot(nw,L), lne=dot(ne,L), lsw=dot(sw,L), lse=dot(se,L);
    float lo=min(lm,min(min(lnw,lne),min(lsw,lse))), hi=max(lm,max(max(lnw,lne),max(lsw,lse)));
    if (hi-lo < max(0.030, hi*0.125)) return m;
    vec2 dir = vec2(-((lnw+lne)-(lsw+lse)), ((lnw+lsw)-(lne+lse)));
    float red = max((lnw+lne+lsw+lse)*0.0625, 0.0078);
    float rd = 1.0/(min(abs(dir.x),abs(dir.y))+red);
    dir = clamp(dir*rd, -8.0, 8.0)*uPx;
    vec3 a = 0.5*(texture2D(tD,uv+dir*(1.0/3.0-0.5)).rgb + texture2D(tD,uv+dir*(2.0/3.0-0.5)).rgb);
    vec3 b = a*0.5 + 0.25*(texture2D(tD,uv-dir*0.5).rgb + texture2D(tD,uv+dir*0.5).rgb);
    float lb = dot(b,L);
    return (lb < lo || lb > hi) ? a : b;
  }
  vec3 aces(vec3 x){ // Narkowicz fit
    return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
  void main(){
    vec3 c = uAA > 0.5 ? aa(vUv) : texture2D(tD,vUv).rgb;
    if (uRush > 0.002) { vec2 d = (vUv - 0.5); float e = smoothstep(0.06, 0.5, length(d)); vec3 sm = c;
      for (int i = 1; i <= 6; i++) sm += texture2D(tD, vUv - d * (float(i) * 0.016 * uRush)).rgb;
      c = mix(c, sm / 7.0, e * uRush); }
    if (uOut > 0.001) {
      vec2 o = uPx * uOutW; float z0 = lz(vUv);
      float zl = lz(vUv-vec2(o.x,0.0)), zr = lz(vUv+vec2(o.x,0.0)), zd = lz(vUv-vec2(0.0,o.y)), zu = lz(vUv+vec2(0.0,o.y));
      float g = abs(zl + zr - 2.0*z0) + abs(zd + zu - 2.0*z0);
      float e = smoothstep(uOutLo, uOutHi, g / max(z0, 1.0));
      c *= mix(vec3(1.0), uOutC, e * uOut);
    }
    c += texture2D(tB,vUv).rgb * uStr;
    c = aces(c * uExp);
    float l = dot(c, vec3(0.2126,0.7152,0.0722));
    c = mix(c, c*vec3(0.94,0.98,1.10), (1.0-smoothstep(0.0,0.45,l))*0.3);
    c = mix(c, c*vec3(1.05,1.00,0.93), smoothstep(0.55,1.0,l)*0.4);
    c = (c - 0.5)*1.12 + 0.5; c = max(c, 0.0); c = c / (1.0 + c*0.12);
    c = mix(vec3(l), c, 1.18);
    vec2 q = vUv-0.5; float v = 1.0 - dot(q,q)*(0.85+uVig*0.9); c *= clamp(v,0.0,1.0);
    c = pow(max(c, 0.0), vec3(1.0/2.2));
    c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453) - 0.5) / 255.0;
    gl_FragColor = vec4(c, 1.0);
  }` });
function renderPost() {
  renderer.info.reset();
  renderer.setRenderTarget(rtScene); renderer.clear(); renderer.render(scene, camera);
  quad.material = brightMat; brightMat.uniforms.tD.value = rtScene.texture;
  renderer.setRenderTarget(rtA); renderer.clear(); renderer.render(quadScene, quadCam);
  quad.material = blurMat; blurMat.uniforms.uRes.value.set(rtA.width, rtA.height);
  blurMat.uniforms.tD.value = rtA.texture; blurMat.uniforms.uDir.value.set(1, 0); renderer.setRenderTarget(rtB); renderer.clear(); renderer.render(quadScene, quadCam);
  blurMat.uniforms.tD.value = rtB.texture; blurMat.uniforms.uDir.value.set(0, 1); renderer.setRenderTarget(rtA); renderer.clear(); renderer.render(quadScene, quadCam);
  quad.material = compMat; compMat.uniforms.tD.value = rtScene.texture; compMat.uniforms.tB.value = rtA.texture; compMat.uniforms.tZ.value = rtScene.depthTexture;
  compMat.uniforms.uPx.value.set(1 / rtScene.width, 1 / rtScene.height); compMat.uniforms.uNear.value = camera.near; compMat.uniforms.uFar.value = camera.far;
  renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); renderer.domElement.style.width = ''; renderer.domElement.style.height = '';

// ---------- input ----------
const stick = { L: { x: 0, y: 0, down: 0 }, R: { x: 0, y: 0, down: 0 } };
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = 1; if (e.key === ' ') { player.jump = 1; e.preventDefault(); } if (e.key.toLowerCase() === 'b') toggleBoard(); if (e.key.toLowerCase() === 'r') respawn(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });
const FLICK = { at: .72, within: .28 };
function bindStick(el, out, onTap, onFlick, rel) {

  const set = (cx, cy) => {

bindStick(document.getElementById('stkL'), stick.L, null, null, false);
bindStick(document.getElementById('stkR'), stick.R, () => { player.jump = 1; }, null, true);
document.getElementById('boardB').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleBoard(); });
document.getElementById('resetB').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); respawn(); });
// mouse look on desktop
{
  let drag = null; const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') { drag = { x: e.clientX, y: e.clientY }; } });
  addEventListener('pointermove', e => { if (!drag || e.pointerType !== 'mouse') return; cam.az -= (e.clientX - drag.x) * .006; cam.el = clamp(cam.el + (e.clientY - drag.y) * .004, CAM.elMin, CAM.elMax); cam.idle = 0; drag.x = e.clientX; drag.y = e.clientY; });
  addEventListener('pointerup', () => { drag = null; });

}
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- player ----------
const player = { pos: new THREE.Vector3(SPAWN.x, SPAWN.y, SPAWN.z), vel: new THREE.Vector3(), heading: SPAWN.heading, grounded: true, board: false, jump: 0, sprint: 0, coyote: 0,
  speed: 0, steer: 0, lean: 0, pushT: 0, pushK: 0, airT: 0, rHold: 0, safe: new THREE.Vector3(SPAWN.x, SPAWN.y, SPAWN.z), safeT: 0, wall: false, moving: 0 };
const cam = { az: SPAWN.heading, el: CAM.el, idle: 9, pos: new THREE.Vector3(), tgt: new THREE.Vector3(), rush: 0 };
function toggleBoard() { player.board = !player.board; document.getElementById('boardB').classList.toggle('on', player.board); board.visible = player.board; if (player.board) player.pushT = .1; }
function respawn() { player.pos.copy(player.safe); player.vel.set(0, 0, 0); player.speed = 0; player.grounded = true; }
const gN = new THREE.Vector3(0, 1, 0), _boxes = [], _cars = [];
function stickWorld() {
  // left stick -> world direction, relative to the camera azimuth
  let lx = stick.L.x, ly = stick.L.y;
  if (keys.a || keys.arrowleft) lx -= 1; if (keys.d || keys.arrowright) lx += 1; if (keys.w || keys.arrowup) ly -= 1; if (keys.s || keys.arrowdown) ly += 1;
  lx = clamp(lx, -1, 1); ly = clamp(ly, -1, 1);
  const mag = Math.min(1, Math.hypot(lx, ly)); if (mag < MOVE.dead) return { x: 0, z: 0, mag: 0 };
  const sa = Math.sin(cam.az), ca = Math.cos(cam.az);
  let dx = -ly * sa - lx * ca, dz = -ly * ca + lx * sa; const d = Math.hypot(dx, dz) || 1;
  return { x: dx / d, z: dz / d, mag: Math.pow(clamp((mag - MOVE.dead) / (1 - MOVE.dead), 0, 1), MOVE.curve) };
}
// After the move: snap to the floor, step up a curb, fall off an edge, or refuse a face
// steeper than the step. Returns 'landed' on the frame the air ends.
function settle(p, g, step, px, pz) {
  if (p.grounded) {
    const d = g.floor - p.pos.y;
    if (d > step) { p.pos.x = px; p.pos.z = pz; p.vel.x = 0; p.vel.z = 0; p.pos.y = groundUnder(p.pos, step, null).floor; p.vel.y = 0; return 'blocked'; }

}
function groundUnder(p, step, vel) {
  // heightmap + roofs + cars; walls push the position out
  gridQuery(p.x, p.z, 1.2, _boxes);
  for (const c of carsNear(p.x, p.z, 8, _cars)) _boxes.push(c.box);

}
function stepFoot(dt) {

function stepSkate(dt) {

// ---------- camera ----------
function stepCam(dt) {
  const rx = stick.R.x, ry = stick.R.y;
  if (Math.abs(rx) > .05 || Math.abs(ry) > .05) { cam.az -= rx * CAM.yawRate * dt; cam.el = clamp(cam.el + ry * CAM.elRate * dt, CAM.elMin, CAM.elMax); cam.idle = 0; }

    cam.az += wrapAngle(want - cam.az) * Math.min(1, CAM.follow * dt * clamp(sp / 5, .3, 1.4));

const speedEl = document.getElementById('speed').querySelector('b'), buildEl = document.getElementById('build');
